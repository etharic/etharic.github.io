"July 2026 evidence"],"rows":[["June global oil supply","98.8 mb/d"],["Supply shortfall vs pre-war","9.4 mb/d"],["June Gulf exports","16.1 mb/d"],["Pre-war Gulf exports","~24.0 mb/d"],["June OECD stock draw","62 million barrels"],["Government releases within OECD draw","~44 million barrels"],["North Sea Dated, early July","~$68/bbl"],["North Sea Dated after renewed hostilities","~$77/bbl"]]},{"type":"p","html":"<em>Source: IEA July 10, 2026. Price observations refer to different dates, not monthly averages.</em>"},{"type":"p","html":"The OECD inventory decline includes government stock releases; it is not equivalent to a 62-million-barrel decline in commercial inventories. Emergency releases and alternative routes can cushion immediate shortages but do not replace damaged or unavailable refining and transport capacity."}]},{"id":"energy-inflation-2026-chapter-3","title":"Inflation transmission","words":201,"elements":[{"type":"p","html":"The <a href=\"https://www.imf.org/en/publications/weo/issues/2026/07/08/world-economic-outlook-update-july-2026\" target=\"_blank\" rel=\"noopener\">IMF July World Economic Outlook Update</a> projects global headline inflation of 4.7% in 2026, compared with 4.1% in 2025, and global growth of 3.0%. This is consistent with an adverse supply shock but does not isolate how much of the revision comes from each energy-market disruption."},{"type":"p","html":"Households face direct changes in fuel and utility costs. Businesses face changes in freight, fuel and energy-intensive inputs, some of which may be passed to customers. The effect depends on expenditure weights, duration, exchange rates, taxes and government interventions."},{"type":"p","html":"<strong>Exhibit 2. Direct headline-inflation sensitivity</strong>"},{"type":"p","html":"<em>Percentage-point contribution from energy components.</em>"},{"type":"table","headers":["Energy CPI weight","10% energy inflation","20% energy inflation"],"rows":[["5%","+0.5 pp","+1.0 pp"],["8%","+0.8 pp","+1.6 pp"],["10%","+1.0 pp","+2.0 pp"]]},{"type":"p","html":"<em>Illustrative fixed-weight arithmetic, not country-specific forecasts. Excludes indirect pass-through, substitution and administered-price effects.</em>"},{"type":"p","html":"A one-time increase in energy prices raises the price level but does not automatically generate persistent inflation. Repeated cost increases, delayed pass-through or broader wage and pricing adjustments would be required for sustained inflation pressure. The relevant question is whether physical disruption lasts long enough to generate repeated adjustments."}]},{"id":"energy-inflation-2026-chapter-4","title":"Why lower crude prices may mislead","words":91,"elements":[{"type":"p","html":"Crude is a refinery input. Lower crude prices need not produce equivalent declines in diesel or jet-fuel prices when processing capacity is constrained. The IEA reported refined-product cracks and margins at four-year highs in early July even as crude prices fell, suggesting bottlenecks had shifted partly toward processing and distribution."},{"type":"p","html":"For transport-intensive businesses, the delivered fuel price matters more than Brent alone. Crude benchmarks may therefore overstate the relief reaching the real economy. Monitoring diesel and jet-fuel spreads is more informative than watching crude in isolation."}]},{"id":"energy-inflation-2026-chapter-5","title":"Growth and policy implications","words":67,"elements":[{"type":"p","html":"Net energy importers face reduced purchasing power and potentially weaker trade balances. Manufacturing-intensive economies and those with limited fiscal capacity are especially exposed. Central banks cannot restore refineries through higher interest rates, but can influence demand and second-round inflation expectations. A response based only on headline energy inflation could unnecessarily weaken activity; sustained pass-through into wages and services would present a different policy problem."}]},{"id":"energy-inflation-2026-chapter-6","title":"Outlook and monitoring","words":160,"elements":[{"type":"p","html":"Our base case assumes improving crude availability but a slower recovery in refined-product supply. The key indicators are refinery throughput, product crack spreads, Gulf exports, commercial inventories and strategic releases."},{"type":"p","html":"<strong>Exhibit 3. Forecast conditions</strong>"},{"type":"table","headers":["Development","Implication"],"rows":[["Refinery throughput recovers rapidly","Weakens persistence thesis"],["Crude falls but product cracks stay elevated","Supports persistence thesis"],["Product inventories rebuild sustainably","Reduces near-term inflation risk"],["Renewed shipping disruption","Raises inflation and growth risks"],["Core inflation remains stable","Limits evidence of second-round effects"]]},{"type":"p","html":"Sustained normalization of refinery output, inventories and delivered fuel prices would weaken the forecast. Until then, falling crude benchmarks alone are insufficient evidence that the shock&#x27;s inflationary consequences have ended."},{"type":"p","html":"<strong>Central expectation:</strong> Elevated headline inflation pressure persists through H2 2026, particularly in economies exposed to imported refined fuels and energy-intensive production."},{"type":"p","html":"<em>Historical macroeconomic research reconstruction. Information cutoff: July 10, 2026. Written retrospectively, not originally published July 11, 2026. Independent scenario analysis, not an official IMF or IEA forecast.</em>"}]}]};
const EA_TAKE_PRIVATE_ARTICLE={"id":"ea-55bn-take-private","title":"Electronic Arts: Reassessing the Economics of the $55 Billion Take-Private","date":"2 oct 2025","totalWords":1829,"chapters":[{"id":"ea-introduction","title":"introduction","words":25,"elements":[{"type":"p","html":"<em>EA’s recurring revenue and cash-generative franchises support leveraged ownership, but the substantial equity requirement makes operating growth and exit valuation central to sponsor returns.</em>"}]},{"id":"ea-chapter-1","title":"Executive assessment","words":180,"elements":[{"type":"p","html":"The proposed acquisition of Electronic Arts by the Public Investment Fund (PIF), Silver Lake and Affinity Partners represents a significant test of leveraged-buyout economics at an unusually large transaction size."},{"type":"p","html":"The consortium has agreed to acquire EA for $210 per share in cash, with an announced transaction valuation of approximately $55 billion. Financing includes approximately $36 billion of equity commitments, incorporating PIF’s existing shareholding, and $20 billion of committed debt financing, of which $18 billion is expected to be funded at closing."},{"type":"p","html":"EA’s established franchises and recurring live-service revenue provide a relatively stable operating foundation. However, the acquisition is being undertaken at approximately 19 times estimated forward EBITDA, leaving limited room for earnings underperformance or exit multiple compression."},{"type":"p","html":"Our provisional analysis indicates that EA could support meaningful debt reduction under a reasonable range of cash-generation assumptions. Nevertheless, even an improving operating business may produce modest sponsor returns given the size of the initial equity commitment. The transaction’s economics are therefore likely to depend on the consortium’s investment horizon and return requirements, rather than conventional financial leverage alone."}]},{"id":"ea-chapter-2","title":"1. Transaction terms and funding structure","words":250,"elements":[{"type":"p","html":"EA’s September 29 announcement established the principal terms of the acquisition. The $210 consideration represents a premium of approximately 25% to EA’s unaffected closing price on September 25. The transaction remains subject to shareholder approval, regulatory review and customary closing conditions."},{"type":"subhead","html":"Table 1. Announced transaction terms"},{"type":"table","headers":["Item","Announced amount"],"rows":[["Headline transaction valuation","~$55.0bn"],["Consideration per share","$210"],["Premium to unaffected price","~25%"],["Equity commitments, including PIF rollover","~$36bn"],["Committed debt financing","$20bn"],["Expected funded debt at closing","~$18bn"],["Existing PIF ownership","9.9%"],["Expected closing","Q1 FY2027"]]},{"type":"p","html":"<em>Source: EA acquisition announcement, September 29, 2025. Rounded figures; not a reconciled sources-and-uses statement.</em>"},{"type":"p","html":"The financing structure requires particular care. PIF’s existing shareholding is being rolled into the acquisition vehicle, meaning the disclosed equity commitment is not entirely new cash contributed at closing. Similarly, the difference between $20 billion of committed debt and $18 billion expected to be funded should not be interpreted as available operating liquidity."},{"type":"p","html":"EA reported approximately $2.25 billion of cash and short-term investments and approximately $1.9 billion of debt at March 31, 2025. These balances provide historical context, but the closing balance sheet will depend on intervening operations, debt treatment, minimum cash requirements and transaction expenses."},{"type":"p","html":"A fully reconciled sources-and-uses statement cannot be established from the headline announcement alone. For the return analysis, we therefore use $36 billion as a provisional aggregate equity-capital reference, consistent with the disclosed equity commitment, while recognizing that final funded equity and the economic treatment of PIF’s rollover may differ."}]},{"id":"ea-chapter-3","title":"2. Operating performance and cash-flow quality","words":232,"elements":[{"type":"p","html":"EA’s financial characteristics are relevant to its suitability for leveraged ownership. Its portfolio includes established sports franchises, recurring player spending and digital content sales, which provide revenue beyond initial game purchases. However, live-service revenue is not equivalent to contracted subscription revenue. Player engagement, release schedules and franchise performance remain important determinants of demand."},{"type":"subhead","html":"Table 2. Historical performance and current outlook"},{"type":"table","headers":["Metric","FY2024 actual","FY2025 actual","FY2026 guidance"],"rows":[["Net revenue","7.56","7.46","7.10–7.50"],["Net bookings","7.43","7.36","7.60–8.00"],["Live services and other revenue","5.55","5.46","—"],["Operating cash flow","2.32","2.08","2.20–2.40"],["Capital expenditure","~0.20","~0.22","Not confirmed"],["Operating cash flow less capex","~2.12","~1.86","—"]]},{"type":"p","html":"<em>US$bn. Sources: EA FY2025 Form 10-K and July 29, 2025 FY2026 guidance. FY2026 figures are company forecasts.</em>"},{"type":"p","html":"EA’s FY2026 outlook suggests improved operating cash generation despite relatively limited expected revenue growth. The difference between bookings and recognized revenue is particularly relevant because cash collections and accounting recognition may occur in different periods."},{"type":"p","html":"Using the $2.30 billion midpoint of FY2026 operating cash-flow guidance and approximately $0.23 billion of illustrative capital expenditure produces a preliminary cash-generation reference of $2.07 billion before adjusting for the acquisition’s new financing structure. This provides a starting point for the debt model, rather than an amount that can automatically be applied to debt repayment."}]},{"id":"ea-chapter-4","title":"3. Entry valuation and financing burden","words":150,"elements":[{"type":"p","html":"Reuters Breakingviews estimated EA’s FY2026 EBITDA at approximately $2.9 billion. Using the announced $55 billion transaction valuation as an approximate enterprise-value reference implies an entry multiple near 19×. This is a screening multiple, not a fully reconciled purchase-price calculation."},{"type":"subhead","html":"Table 3. Financing-cost sensitivity"},{"type":"table","headers":["Metric","7%","8%","9%"],"rows":[["Annual interest on $18bn debt","1.26","1.44","1.62"],["Debt / FY2026E EBITDA","6.2×","6.2×","6.2×"]]},{"type":"p","html":"<em>US$bn. Independent borrowing-cost assumptions, not disclosed financing terms.</em>"},{"type":"p","html":"At $18 billion of expected funded acquisition debt, gross opening leverage would be approximately 6.2× forward EBITDA. The financing burden is substantial relative to EA’s historical cash generation. The company’s modest physical capital requirements are favorable, but game development, licensing and content expenditure remain economically necessary and are not fully represented by capital expenditure alone."},{"type":"p","html":"The transaction’s debt capacity must consequently be assessed using post-financing cash flow rather than EBITDA in isolation."}]},{"id":"ea-chapter-5","title":"4. Provisional cash-sweep model","words":262,"elements":[{"type":"p","html":"To address the limitations of the earlier LBO analysis, debt repayment is calculated from modeled cash availability. The model begins with $18 billion of acquisition debt and a $2.07 billion annual pre-acquisition-financing cash-flow reference. The latter grows at the same illustrative rate as EBITDA in each scenario."},{"type":"subhead","html":"Table 4. Cash-sweep and deleveraging scenarios"},{"type":"table","headers":["Metric","Downside","Base case","Upside"],"rows":[["Annual cash-flow growth","3%","6%","9%"],["Opening acquisition debt","18.0","18.0","18.0"],["Year 1 cash available for repayment","1.09","1.15","1.21"],["Year 3 cash available for repayment","1.35","1.57","1.80"],["Year 5 cash available for repayment","1.66","2.08","2.54"],["Cumulative debt repayment","6.82","7.95","9.17"],["Ending debt","11.18","10.05","8.83"]]},{"type":"p","html":"<em>US$bn. Independent illustrative cash-sweep assumptions; not lender terms or company guidance.</em>"},{"type":"p","html":"For the financing adjustment, we assume an 8% borrowing cost, a 25% effective cash-tax benefit on incremental interest, and approximately $45 million of historical interest expense already reflected in the starting cash-flow measure."},{"type":"p","html":"The model assumes all residual cash after this financing adjustment is used to repay debt. This is deliberately simplified: it does not incorporate minimum liquidity reserves, mandatory amortization, detailed working-capital schedules, debt fees, or restrictions on interest deductibility."},{"type":"p","html":"The base case indicates approximately $8 billion of cumulative debt reduction over five years, assuming cash generation grows by 6% annually and all modeled surplus is applied to repayment. This is more supportable than independently selecting an exit debt balance, but it remains conditional on the assumed cash-conversion profile."}]},{"id":"ea-chapter-6","title":"5. Sponsor return analysis","words":314,"elements":[{"type":"p","html":"The revised LBO scenarios use the cash-sweep outputs rather than separately assumed debt-repayment figures. For consistency, we apply a provisional $36 billion opening equity reference and a five-year holding period. Exit EBITDA is derived from the $2.9 billion forward reference using the scenario growth rates."},{"type":"subhead","html":"Table 5. Five-year aggregate equity-return scenarios"},{"type":"table","headers":["Metric","Downside","Base case","Upside"],"rows":[["EBITDA CAGR","3%","6%","9%"],["Exit EBITDA","3.36","3.88","4.46"],["Exit EV / EBITDA","15×","17×","19×"],["Exit enterprise value","50.4","66.0","84.7"],["Ending modeled debt","11.18","10.05","8.83"],["Exit equity value","39.2","55.9","75.9"],["Gross equity MOIC","1.09×","1.55×","2.11×"],["Five-year gross IRR","1.7%","9.2%","16.1%"]]},{"type":"p","html":"<em>US$bn unless stated. Illustrative $36bn aggregate opening equity, five-year holding period; no interim distributions or fees.</em>"},{"type":"subhead","html":"Table 6. Required exit EBITDA at a 20% gross IRR hurdle"},{"type":"table","headers":["Exit multiple","Required EBITDA"],"rows":[["17×","$5.86bn"],["19×","$5.24bn"],["21×","$4.74bn"]]},{"type":"p","html":"<em>Illustrative hurdle; $36bn opening equity, five-year holding period, $10bn exit net debt.</em>"},{"type":"p","html":"The base case generates approximately 9% gross annualized equity returns. This is positive, but below a hypothetical 20% gross return hurdle sometimes used to assess leveraged-buyout opportunities. The upside case approaches 16%, requiring both stronger EBITDA growth and preservation of the approximate entry valuation multiple."},{"type":"p","html":"These results highlight the effect of the substantial initial equity commitment. Although leverage improves returns when enterprise value increases, the consortium is financing a large proportion of the acquisition with equity, limiting the extent to which financial engineering alone can generate high returns."},{"type":"p","html":"A five-year 20% gross IRR on a $36 billion equity investment requires approximately $89.6 billion of exit equity value. Assuming $10 billion of remaining net debt, the corresponding enterprise value requirement is approximately $99.6 billion. At a 19× exit multiple, required EBITDA of approximately $5.24 billion represents roughly 13% annualized growth from the $2.9 billion starting estimate."}]},{"id":"ea-chapter-7","title":"6. Value creation and diligence priorities","words":183,"elements":[{"type":"p","html":"EA’s existing franchises provide several potential avenues for growth, including higher player engagement, recurring monetization and broader licensing opportunities. However, the consortium has not disclosed a sufficiently detailed operating plan to justify assigning a specific synergy value."},{"type":"p","html":"Cost reductions should also be approached cautiously. Game development and intellectual-property investment support the franchises that make EA attractive in the first place. Reducing expenditure without considering its effect on future releases could improve short-term cash flow at the expense of longer-term value."},{"type":"p","html":"The most important areas for further diligence are franchise-level bookings, licensing renewals, cash conversion, development expenditure, debt covenants and financing terms."},{"type":"p","html":"EA’s FY2025 filing disclosed approximately $1.5 billion of commitments to content licensors, independent developers and distribution partners for which performance obligations remained outstanding. These commitments are not equivalent to financial debt, but their timing and economic implications are relevant to the cash-flow forecast."},{"type":"p","html":"The transaction also remains exposed to shareholder and regulatory approvals. The September 29 merger agreement contains provisions governing termination and alternative acquisition proposals, and the acquisition is not subject to a financing condition."}]},{"id":"ea-chapter-8","title":"7. Transaction assessment","words":189,"elements":[{"type":"p","html":"EA’s operating characteristics provide a credible basis for leveraged ownership. Its established franchises, recurring digital revenue and relatively modest physical capital requirements support cash generation, while the consortium’s equity commitments reduce dependence on acquisition debt."},{"type":"p","html":"The valuation is the more demanding element. At approximately 19× forward EBITDA, the acquisition requires continued operating performance and meaningful long-term earnings growth to produce attractive aggregate equity returns."},{"type":"p","html":"The integrated scenarios suggest that EA could reduce acquisition debt substantially under reasonable cash-generation assumptions. However, moderate EBITDA growth and deleveraging alone may not be sufficient to achieve conventional high-teens or 20% gross sponsor returns."},{"type":"p","html":"The transaction may nevertheless make sense for a consortium with differing strategic objectives and investment horizons. PIF’s existing gaming investments could support a longer-term ownership approach, while the financial sponsors may seek value through operating improvements, capital allocation and eventual liquidity events."},{"type":"p","html":"The central financial conclusion is that EA’s cash-generative business can support the proposed leverage, but the purchase valuation leaves limited room for disappointing operating performance. The consortium’s ultimate returns will depend more on sustained earnings growth and exit valuation than on leverage alone."}]},{"id":"ea-chapter-9","title":"Contemporary sources","words":44,"elements":[{"type":"list","items":["<a href=\"https://news.ea.com/press-releases/press-releases-details/2025/EA-Announces-Agreement-to-be-Acquired-by-PIF-Silver-Lake-and-Affinity-Partners-for-55-Billion/default.aspx\" target=\"_blank\" rel=\"noopener\">EA acquisition announcement</a>","<a href=\"https://www.sec.gov/Archives/edgar/data/712515/000071251525000022/ea-20250331.htm\" target=\"_blank\" rel=\"noopener\">EA FY2025 Form 10-K</a>","<a href=\"https://www.sec.gov/Archives/edgar/data/712515/000114036125036415/ef20056167_8k.htm\" target=\"_blank\" rel=\"noopener\">EA September 2025 merger filing</a>"]},{"type":"p","html":"<em>Historical M&amp;A transaction research reconstruction. Information cutoff: October 1, 2025. Prepared retrospectively, not originally published on October 2, 2025. Independent illustrative scenarios; not a fairness opinion or regulated investment research.</em>"}]}]};
const NOVO_NORDISK_ARTICLE={"id":"novo-nordisk-competitive-pressures","title":"Novo Nordisk: Competitive Pressures Challenge the Earnings Outlook","date":"31 jul 2025","totalWords":905,"chapters":[{"id":"novo-introduction","title":"introduction","words":25,"elements":[{"type":"p","html":"<em>The FY2025 guidance reset points to weaker commercial momentum and increasing earnings risk. Valuation has become less demanding, but further estimate revisions remain a concern.</em>"}]},{"id":"novo-chapter-1","title":"Investment view","words":79,"elements":[{"type":"p","html":"<strong>Cautious</strong>"},{"type":"p","html":"Novo Nordisk’s latest guidance reduction reflects a deterioration in US commercial expectations, with competition and net pricing pressure weighing on the earnings outlook. Our illustrative FY2025 estimates sit modestly below management’s revised guidance midpoints. Although the share-price correction has compressed valuation multiples, limited earnings visibility argues against interpreting the decline as an immediate re-rating opportunity."},{"type":"p","html":"<strong>Key estimates:</strong> FY25E sales growth 10.5% (CER); FY25E EBIT growth 11.5% (CER); FY25E EBIT DKK 143bn (illustrative CER basis)."}]},{"id":"novo-chapter-2","title":"FY2025 guidance reset","words":244,"elements":[{"type":"p","html":"Novo Nordisk’s <a href=\"https://www.novonordisk.com/news-and-media/news-and-ir-materials/news-details.html?id=916407\" target=\"_blank\" rel=\"noopener\">July 29 trading update</a> reduced full-year sales-growth guidance from 13–21% to 8–14% and operating-profit growth guidance from 16–24% to 10–16%, both at constant exchange rates (CER). Management attributed the downgrade primarily to weaker US expectations for Wegovy and Ozempic, continued competition from compounded GLP-1 products and slower-than-anticipated international uptake."},{"type":"p","html":"<strong>Table 1. FY2025 guidance revision and analyst estimates</strong>"},{"type":"p","html":"<em>DKK billion, except growth rates</em>"},{"type":"table","headers":["Metric","Previous midpoint","Revised midpoint","Analyst FY25E"],"rows":[["Sales growth (CER)","17.0%","11.0%","10.5%"],["EBIT growth (CER)","20.0%","13.0%","11.5%"],["Implied sales","339.8","322.3","320.9"],["Implied EBIT","154.0","145.0","143.1"],["Implied EBIT margin","45.3%","45.0%","44.6%"]]},{"type":"p","html":"<em>Source: Novo Nordisk FY2024 results and July 29, 2025 guidance. Independent illustrative estimates use FY2024 reported sales of DKK 290.4bn and EBIT of DKK 128.3bn as the reference base. CER-derived amounts are not reported-currency forecasts.</em>"},{"type":"p","html":"Our estimates imply approximately DKK 19bn of sales and DKK 11bn of EBIT downside relative to the previous guidance midpoint. The revision is significant for a company whose valuation previously reflected sustained double-digit growth and high operating margins."},{"type":"p","html":"Foreign exchange presents an additional headwind. Management expects reported-currency sales growth to be approximately four percentage points below CER guidance, with operating-profit growth around seven points lower. This translation effect should be separated from the underlying deterioration in commercial performance."}]},{"id":"novo-chapter-3","title":"Competitive dynamics and earnings sensitivity","words":207,"elements":[{"type":"p","html":"The investment debate is shifting from obesity-treatment market growth to Novo’s ability to defend market share and net realized prices. Eli Lilly’s competing treatments have increased competitive intensity in the US, while patient access, product availability and payer negotiations remain important determinants of commercial performance."},{"type":"p","html":"<strong>Table 2. FY2025 EBIT sensitivity</strong>"},{"type":"p","html":"<em>DKK billion; illustrative revenue and operating-margin scenarios</em>"},{"type":"table","headers":["Sales","42% margin","44% margin","46% margin"],"rows":[["DKK 310bn","130.2","136.4","142.6"],["DKK 321bn","134.8","141.2","147.7"],["DKK 330bn","138.6","145.2","151.8"]]},{"type":"p","html":"<em>Independent scenario analysis. Central sales assumption rounded from DKK 320.9bn. The analyst’s illustrative EBIT estimate of DKK 143.1bn implies a 44.6% margin.</em>"},{"type":"p","html":"The principal earnings risk is that volume growth fails to offset pricing pressure and higher commercial expenditure. Manufacturing efficiencies and favorable product mix could provide some mitigation, although sustained margin recovery will depend on the company’s ability to stabilize its competitive position."},{"type":"p","html":"At the central revenue assumption, a 100-basis-point change in operating margin represents approximately DKK 3.2bn of annual EBIT. The sensitivity highlights the importance of net pricing and cost discipline as competition increases. Even modest margin compression could materially affect earnings if volume growth remains below previous expectations."}]},{"id":"novo-chapter-4","title":"Valuation and earnings risk","words":164,"elements":[{"type":"p","html":"Novo’s share-price correction has reduced its historical valuation premium, but the appropriate multiple remains dependent on earnings visibility and the durability of its competitive position. Further downward revisions could offset part of the apparent valuation benefit."},{"type":"p","html":"<strong>Table 3. Illustrative P/E valuation sensitivity</strong>"},{"type":"p","html":"<em>Implied DKK price per share</em>"},{"type":"table","headers":["Diluted EPS","12× P/E","14× P/E","16× P/E"],"rows":[["DKK 19","228","266","304"],["DKK 21","252","294","336"],["DKK 23","276","322","368"]]},{"type":"p","html":"<em>Illustrative valuation scenarios, not formal price targets. EPS assumptions are independent sensitivities rather than modeled reported-currency forecasts. FY2024 diluted EPS was DKK 22.63.</em>"},{"type":"p","html":"The sensitivity underscores the combined effect of earnings revisions and multiple compression. A sustained re-rating would require improved confidence in Novo’s forward earnings trajectory, particularly its ability to protect profitability as competition intensifies."},{"type":"p","html":"The company’s established manufacturing capabilities, product portfolio and international distribution remain important competitive assets. However, these strengths alone do not establish that the current valuation adequately reflects further downside risk."}]},{"id":"novo-chapter-5","title":"Outlook and catalysts","words":186,"elements":[{"type":"p","html":"The near-term outlook remains cautious, with US prescription trends and realized pricing likely to drive subsequent estimate revisions. Stabilization in Wegovy and Ozempic demand, improved payer access and more consistent commercial execution would support greater confidence in management’s revised outlook."},{"type":"p","html":"The principal downside risks are further market-share losses, higher rebates and weaker operating leverage. Conversely, stronger prescription momentum, improved product availability and successful pipeline execution could support an earnings recovery and renewed multiple expansion."},{"type":"p","html":"Our illustrative FY2025 estimates of DKK 321bn in sales and DKK 143bn in EBIT remain modestly below management’s revised midpoints on a CER-derived basis. Until there is clearer evidence of earnings stabilization, the recent share-price correction alone does not justify a more constructive valuation stance."},{"type":"p","html":"The central investment question is no longer the size of the obesity-treatment market, but Novo Nordisk’s ability to defend profitable growth within it."},{"type":"p","html":"<em>Historical equity research-style reconstruction · 31 July 2025 · Information cutoff: 30 July 2025. Prepared retrospectively, not originally published on that date. Independent illustrative estimates are distinguished from company guidance. This is not research issued by a regulated investment bank.</em>"}]}]};
const SILVER_RELATIVE_VALUE_ARTICLE={"id":"silver-relative-value-opportunity","title":"Silver’s Relative-Value Opportunity Amid Gold’s Record Rally","date":"3 feb 2025","totalWords":799,"chapters":[{"id":"silver-introduction","title":"introduction","words":19,"elements":[{"type":"p","html":"<em>Silver’s industrial demand and supply characteristics provide a basis for relative outperformance, although investment flows remain the key variable.</em>"}]},{"id":"silver-chapter-1","title":"Investment view","words":109,"elements":[{"type":"p","html":"Silver presents an interesting relative-value opportunity following gold’s strong performance over the past year. With the gold-to-silver ratio approaching 90 at the end of January, silver appears relatively inexpensive compared with gold across several historical periods. While this does not establish fundamental undervaluation, resilient industrial demand and relatively slow supply adjustment provide a reasonable basis for expecting stronger price performance if investment interest in precious metals continues."},{"type":"p","html":"The central expectation is for silver to outperform gold in percentage terms over the twelve months ending February 2026. This view is primarily driven by the potential for additional investment demand rather than an anticipated shortage of physical silver."}]},{"id":"silver-chapter-2","title":"Market context","words":272,"elements":[{"type":"p","html":"Gold extended its rally at the end of January, with <a href=\"https://www.kitco.com/news/off-the-wire/2025-01-31/gold-surges-past-2800-tariff-threats-reignite-record-rally\" target=\"_blank\" rel=\"noopener\">Reuters reporting</a> that spot prices had exceeded $2,800 per troy ounce for the first time. Demand for defensive assets has remained strong despite elevated bond yields, supported by economic uncertainty and investors seeking diversification."},{"type":"p","html":"Silver has participated in the broader precious-metals rally but has not matched gold’s recent performance. At approximately $31–32 per ounce, the gold-to-silver ratio stood close to 90 at the end of January. The ratio is a useful measure of relative pricing, although differences in liquidity, demand composition and economic sensitivity mean that historical comparisons cannot establish an appropriate valuation on their own."},{"type":"image","alt":"Gold-to-silver ratio, January 2022 to January 2025","src":"gold-silver-ratio-2022-2025.png"},{"type":"p","html":"<em>Selected monthly observations, World Bank commodity price series; ends January 2025.</em>"},{"type":"p","html":"The potential opportunity lies in how silver responds to incremental investment demand. Its smaller market can experience larger percentage price movements when investor positioning changes, making a narrowing of the ratio plausible if precious-metal investment flows broaden beyond gold."},{"type":"p","html":"### Sensitivity to changes in the gold-to-silver ratio"},{"type":"p","html":"Silver price = Gold price / Gold-to-silver ratio. Assuming gold remains at $2,800 per ounce:"},{"type":"table","headers":["Ratio","Implied silver price","Return from $31.50"],"rows":[["90","$31.11","−1.2%"],["85","$32.94","+4.6%"],["80","$35.00","+11.1%"],["75","$37.33","+18.5%"]]},{"type":"p","html":"Illustrative sensitivity only; these are not price targets. Gold is fixed at $2,800 per ounce and silver reference price is $31.50."},{"type":"p","html":"A narrowing of the ratio to 80 would imply a silver price of $35 under these assumptions, approximately 11% above the reference price. This illustrates relative repricing, not a forecast of the future ratio."}]},{"id":"silver-chapter-3","title":"Industrial demand and supply fundamentals","words":214,"elements":[{"type":"p","html":"Silver’s industrial applications provide an additional source of demand that distinguishes it from gold. The metal is widely used in electronics, electrical equipment and photovoltaic systems, where its conductivity and other physical properties make it an important manufacturing input."},{"type":"p","html":"The <a href=\"https://silverinstitute.org/global-silver-market-forecast-to-remain-in-a-sizeable-deficit-in-2025/\" target=\"_blank\" rel=\"noopener\">Silver Institute’s January 2025 outlook</a> forecasts industrial demand growth of approximately 3% in 2025, exceeding 700 million ounces for the first time. Total demand, however, is expected to remain broadly stable at approximately 1.20 billion ounces, as weaker jewelry and silverware consumption offsets part of the industrial increase. This suggests that industrial growth may provide support without materially tightening aggregate demand."},{"type":"p","html":"Supply is expected to increase by approximately 3% to 1.05 billion ounces, leaving a projected annual deficit of around 149 million ounces. The deficit would mark the fifth consecutive year in which demand exceeds newly available supply, although it is smaller than the estimated shortfall for 2024."},{"type":"p","html":"A substantial proportion of silver is produced as a by-product of mining other metals, limiting the extent to which higher silver prices can stimulate additional mine output in the short term. However, existing inventories and recycling can help absorb market imbalances. The projected deficit should therefore be viewed as a potential source of market sensitivity rather than evidence of an immediate physical shortage."}]},{"id":"silver-chapter-4","title":"Outlook and risks","words":185,"elements":[{"type":"p","html":"The case for silver outperformance depends on investment demand strengthening while industrial consumption remains broadly resilient. Under these conditions, limited short-term supply flexibility could increase the price impact of additional buying, potentially allowing silver to appreciate faster than gold."},{"type":"p","html":"The principal risk is weaker global manufacturing activity. Unlike gold, silver has substantial exposure to industrial demand, making it more vulnerable to a slowdown in production. Higher real interest rates or a stronger US dollar could also reduce investor demand for precious metals."},{"type":"p","html":"Silver consequently offers greater potential for relative appreciation alongside higher downside volatility. The elevated gold-to-silver ratio provides a useful starting point for the analysis, but the direction of investment flows and the resilience of industrial demand will ultimately determine whether the opportunity materializes."},{"type":"p","html":"The balance of these factors supports a constructive twelve-month view on silver relative to gold, without requiring a significant change in gold’s own investment outlook."},{"type":"p","html":"Historical research-style reconstruction using information available by January 31, 2025. Prepared retrospectively, not originally published on February 3, 2025. Independent market commentary; not research issued by a regulated financial institution."}]}]};
const PALANTIR_HISTORICAL_ARTICLE={"id":"palantir-stock-business-caught-up","title":"Palantir's Stock Has Soared. Has Its Business Caught Up?","date":"28 oct 2024","totalWords":1114,"chapters":[{"id":"palantir-introduction","title":"introduction","words":164,"elements":[{"type":"p","html":"I&#x27;ve been following Palantir&#x27;s performance over the past few months, and its rise in the stock market has been difficult to ignore. Earlier this month, a <a href=\"https://www.barrons.com/articles/palantir-stock-record-high-996483aa\" target=\"_blank\" rel=\"noopener\">Barron&#x27;s article</a> reported that the company&#x27;s shares had reached another record high, having gained more than 130% since the beginning of the year. Its recent inclusion in the S&amp;P 500, along with growing excitement around artificial intelligence, has given investors plenty of reasons to pay attention. What interests me, though, is how quickly expectations around the company seem to have changed. Palantir has certainly made progress as a business, particularly in its commercial operations, but its share price has increased much faster than its revenue. That isn&#x27;t necessarily unusual, since investors value companies based on what they expect them to earn in the future rather than just what they&#x27;re earning today. Still, I think Palantir is an interesting example of how a company can become more successful without necessarily becoming a better investment at its current price."}]},{"id":"palantir-chapter-1","title":"A business that's making real progress","words":254,"elements":[{"type":"p","html":"Palantir has traditionally been associated with government and intelligence work. Its software helps organizations bring together information from different sources, analyze it, and make better use of it. More recently, the company has been expanding into the commercial market, particularly through its Artificial Intelligence Platform, or AIP. Its latest financial results have been encouraging. According to <a href=\"https://investors.palantir.com/news-details/2024/Palantir-Reports-Revenue-Growth-of-27-Year-Over-Year-and-Raises-Full-Year-Revenue-Guidance-Record-GAAP-EPS-of-0.06-in-Q2-2024/\" target=\"_blank\" rel=\"noopener\">Palantir&#x27;s second-quarter earnings announcement</a>, revenue grew 27% from the previous year to approximately $678 million, while US commercial revenue grew even faster, increasing 55% to $159 million. I find the commercial growth particularly interesting because it suggests that Palantir&#x27;s software could have a much wider market than government agencies alone. However, US commercial revenue still accounts for less than a quarter of the company&#x27;s total revenue, so it would be a mistake to assume the entire business is growing at the same pace."},{"type":"p","html":"Profitability has improved as well. Palantir reported around $105 million in operating income and $134 million in net income attributable to common shareholders during the quarter. Part of the difference came from interest earned on its cash holdings rather than its software operations, which is worth keeping in mind when assessing the company&#x27;s profitability. Nevertheless, Palantir is growing while making money from its core business, giving investors something more substantial to work with than expectations about future growth alone. I think this is an important improvement because it suggests that the company is beginning to demonstrate the financial potential of its technology, rather than relying entirely on what it might achieve several years from now."}]},{"id":"palantir-chapter-2","title":"What investors are paying for","words":248,"elements":[{"type":"p","html":"On October 25, Palantir closed at approximately $44.86 per share, giving it a market value of around $100 billion. With the company expecting roughly $2.75 billion in revenue this year, investors are paying about 36 times its expected annual sales. That&#x27;s a high valuation, although it doesn&#x27;t automatically mean the stock is overpriced. Software companies can sometimes justify these valuations because they often have long-term customer relationships and can grow without their costs increasing at the same rate. Palantir&#x27;s software can require considerable work to set up and maintain, but the company could still become more profitable as it grows. If revenue continues increasing while profit margins improve, earnings could grow much faster than sales, particularly if its AI products attract more commercial customers over the coming years."},{"type":"p","html":"I can understand why investors find that possibility attractive, but what makes me cautious is how much future success already seems to be reflected in the share price. At around 36 times expected revenue, Palantir needs to deliver substantial growth over several years to support its valuation. Even if the company performs well, its shares could disappoint if that performance falls short of what investors already expect. That&#x27;s the part I find most difficult about valuing companies like Palantir. Recognizing that a business has good prospects is relatively straightforward, but deciding how much those prospects are worth today is considerably harder. The price investors pay matters just as much as the quality of the company they&#x27;re investing in."}]},{"id":"palantir-chapter-3","title":"Politics and the defense technology opportunity","words":211,"elements":[{"type":"p","html":"Palantir&#x27;s political connections have also attracted attention as the US presidential election approaches. Peter Thiel, one of the company&#x27;s co-founders, has longstanding ties within Republican political circles. JD Vance, Donald Trump&#x27;s running mate, previously worked at Thiel&#x27;s investment firm and received substantial financial support from him during his Senate campaign. Given Palantir&#x27;s work with government agencies, these relationships are worth understanding, but I wouldn&#x27;t place too much importance on them when evaluating the company. Political connections don&#x27;t guarantee government contracts, and Palantir&#x27;s interests aren&#x27;t necessarily the same as those of its founders. Its CEO, Alex Karp, has also publicly supported Kamala Harris, which makes it difficult to describe the company as politically aligned with one candidate."},{"type":"p","html":"What I find more interesting is the growing importance of software in defense and intelligence. Modern military operations rely heavily on collecting and analyzing information, and Palantir already has experience building software for these purposes. That experience could help it compete for future projects, although government contracts can be difficult to win and take time to secure. Higher defense spending doesn&#x27;t necessarily mean every company working in the industry will benefit equally, either. For me, Palantir&#x27;s existing products and customer relationships are more convincing reasons to follow its government business than speculation about political influence."}]},{"id":"palantir-chapter-4","title":"A good business at a demanding price","words":237,"elements":[{"type":"p","html":"Palantir&#x27;s recent <a href=\"https://press.spglobal.com/2024-09-06-Palantir-Technologies%2C-Dell-Technologies%2C-and-Erie-Indemnity-Set-to-Join-S-P-500-Others-to-Join-S-P-MidCap-400-and-S-P-SmallCap-600\" target=\"_blank\" rel=\"noopener\">inclusion in the S&amp;P 500</a> is another sign of how much the company has progressed. It has brought greater visibility and required index-tracking funds to add its shares, although this doesn&#x27;t directly improve the underlying business. There are good reasons to be optimistic about Palantir. Its revenue growth has improved, it&#x27;s generating operating profits, and its commercial business gives it opportunities beyond government work. At the same time, its valuation requires investors to have considerable confidence that this growth will continue, which is why I think the company&#x27;s progress and its share price need to be considered separately."},{"type":"p","html":"Palantir could continue growing and become much more profitable over the next several years, and I wouldn&#x27;t be surprised if it does. But that doesn&#x27;t necessarily mean its stock will deliver equally impressive returns from today&#x27;s valuation. A company can perform well and still turn out to be a disappointing investment if much of its future success has already been priced in. For now, I&#x27;m more convinced by Palantir&#x27;s business progress than I am by its share price, although I don&#x27;t think there&#x27;s enough evidence to conclude that investors are necessarily wrong. Sometimes the difficult part of investing isn&#x27;t finding a promising business, but figuring out how much of that promise has already been reflected in the price."},{"type":"p","html":"<em>Retrospective historical analysis using information available by October 25, 2024. Written retrospectively, not originally published in October 2024.</em>"}]}]};
const TESLA_POLITICAL_ARTICLE={"id":"tesla-political-future-2024","title":"Why Tesla’s Political Future Could Matter More Than Its Car Sales","date":"20 sep 2024","totalWords":1281,"chapters":[{"id":"tesla-introduction","title":"introduction","words":178,"elements":[{"type":"p","html":"<em>Historical forecast reconstruction · September 20, 2024</em>"},{"type":"p","html":"Elon Musk’s growing involvement in American politics has made Tesla an increasingly interesting company to follow. Since endorsing Donald Trump in July, Musk has become more involved in the presidential campaign, and earlier this month, Trump proposed establishing a government-efficiency commission headed by Musk if he returns to office."},{"type":"p","html":"I’ve been thinking about what this might mean for Tesla, particularly because the company is already quite unusual from an investment perspective. Its valuation isn’t based entirely on the cars it manufactures today. Investors are also paying for the possibility that autonomous driving, artificial intelligence, and energy storage could eventually become much larger parts of its business."},{"type":"p","html":"Musk’s political involvement adds another consideration. A change in government could affect electric-vehicle subsidies, environmental regulations, international trade, and potentially the rules surrounding autonomous vehicles. Some of these changes might benefit Tesla, while others could make its business more difficult."},{"type":"p","html":"What interests me is how much of Tesla’s valuation could eventually depend on these political developments, even if its actual financial performance doesn’t change very much."}]},{"id":"tesla-chapter-1","title":"Tesla’s business and its valuation are telling different stories","words":267,"elements":[{"type":"p","html":"Tesla’s recent financial results provide a useful starting point. The company <a href=\"https://ir.tesla.com/press-release/tesla-vehicle-production-deliveries-and-date-financial-results-webcast-second-quarter-2024\" target=\"_blank\" rel=\"noopener\">delivered 443,956 vehicles</a> in the second quarter of 2024, approximately 5% fewer than during the same period last year."},{"type":"image","alt":"Tesla quarterly vehicle deliveries","src":"tesla-deliveries-2024.png"},{"type":"p","html":"<em>Tesla vehicle deliveries, Q2 2023 and Q2 2024. Source: Tesla investor relations.</em>"},{"type":"p","html":"Its automotive business has also been facing pressure from lower selling prices and growing competition. According to <a href=\"https://www.sec.gov/Archives/edgar/data/1318605/000162828024032662/tsla-20240630.htm\" target=\"_blank\" rel=\"noopener\">Tesla’s latest quarterly filing</a>, automotive gross margin declined from 19.2% to 18.5% compared with the previous year."},{"type":"p","html":"These aren’t particularly encouraging figures, although they don’t suggest that Tesla is in serious financial difficulty either. The company remains an established manufacturer with considerable resources, a recognizable brand, and a growing energy-storage business."},{"type":"p","html":"One detail I find especially interesting is the role of regulatory credits in Tesla’s profitability."},{"type":"p","html":"Tesla earns these credits by producing vehicles that help other manufacturers meet emissions requirements. In the second quarter, it generated $890 million from regulatory credits, compared with $282 million a year earlier."},{"type":"image","alt":"Tesla automotive regulatory credit revenue","src":"tesla-regulatory-credits-2024.png"},{"type":"p","html":"<em>Automotive regulatory-credit revenue, USD millions. Source: Tesla Q2 2024 Form 10-Q.</em>"},{"type":"p","html":"That’s a substantial increase, and it helped support the company’s automotive margins at a time when vehicle prices were under pressure."},{"type":"p","html":"It also creates an interesting contradiction. Tesla benefits financially from environmental regulations, yet Musk is supporting a presidential candidate who has expressed opposition to several policies intended to encourage electric-vehicle adoption."},{"type":"p","html":"Of course, opposing consumer subsidies isn’t necessarily the same as opposing emissions regulations. These policies operate differently, and changes to one wouldn’t automatically affect the others."},{"type":"p","html":"Still, I think the distinction is important when considering whether a change in government would actually benefit Tesla."}]},{"id":"tesla-chapter-2","title":"The economics of Musk’s political involvement","words":350,"elements":[{"type":"p","html":"In August, <a href=\"https://www.investing.com/news/stock-market-news/trump-says-he-would-consider-ending-7500-electric-vehicle-credit-3578172\" target=\"_blank\" rel=\"noopener\">Trump said he would consider eliminating the $7,500 federal tax credit</a> available to qualifying electric-vehicle buyers. He also indicated that he would consider giving Musk an advisory role."},{"type":"p","html":"Removing the tax credit would make eligible electric vehicles more expensive for consumers, assuming manufacturers didn’t fully offset the change through lower prices. That could reduce demand for Tesla’s vehicles, particularly when affordability is already an important consideration."},{"type":"p","html":"But there’s another side to the argument."},{"type":"p","html":"Tesla has established manufacturing operations, a strong brand, and more financial flexibility than many smaller EV manufacturers. If government support were reduced, some competitors might find it harder to remain competitive."},{"type":"p","html":"Tesla could therefore be negatively affected by the policy while still performing better than certain rivals."},{"type":"p","html":"I think this is a reasonable possibility, although it’s easy to exaggerate. Traditional automakers have substantial resources of their own, and Tesla also benefits from government incentives. A policy that weakens its competitors doesn’t necessarily make Tesla more profitable."},{"type":"p","html":"The political relationship becomes more interesting when considering autonomous driving."},{"type":"p","html":"Tesla has invested heavily in its Full Self-Driving technology and has discussed plans to develop autonomous transportation services. If successful, these businesses could eventually change how investors value the company."},{"type":"p","html":"However, Tesla’s current Full Self-Driving system still requires driver supervision. Developing a commercially viable driverless service involves technical, regulatory, and operational challenges that cannot simply be resolved through a change in government."},{"type":"p","html":"A future administration might approach autonomous-vehicle regulation differently, and investors could interpret that as an improvement in Tesla’s prospects. But regulatory flexibility wouldn’t guarantee technological success, nor would Musk’s political involvement automatically translate into favorable treatment."},{"type":"p","html":"This is where I think the distinction between Tesla’s business and its share price becomes particularly important."},{"type":"p","html":"A company’s valuation reflects expectations about future earnings, not just its current financial results. If investors become more optimistic about Tesla’s autonomous-driving ambitions, its share price could rise before those businesses generate meaningful profits."},{"type":"p","html":"That doesn’t necessarily mean the company has become more valuable in a fundamental sense. It may simply mean investors have become more willing to pay for an uncertain future."}]},{"id":"tesla-chapter-3","title":"China makes the picture more complicated","words":230,"elements":[{"type":"p","html":"There’s another part of Tesla’s business that makes the political argument less straightforward."},{"type":"p","html":"Tesla is an American company, but it operates internationally and faces increasingly capable competitors in China. Manufacturers such as BYD have developed considerable advantages in production costs, battery supply chains, and competitive pricing."},{"type":"p","html":"The United States has announced substantial tariffs on Chinese electric vehicles, while the European Union is pursuing additional duties on vehicles manufactured in China."},{"type":"p","html":"At first glance, these restrictions might appear beneficial for Tesla because they make it harder for Chinese competitors to enter certain markets."},{"type":"p","html":"But Tesla also manufactures vehicles in Shanghai."},{"type":"p","html":"In August, the <a href=\"https://ec.europa.eu/commission/presscorner/api/files/document/print/en/ip_24_4301/IP_24_4301_EN.pdf\" target=\"_blank\" rel=\"noopener\">European Commission proposed an additional duty of 9%</a> on Tesla vehicles imported from China, although this was lower than the rates proposed for several Chinese manufacturers."},{"type":"image","alt":"Proposed EU additional duties","src":"eu-ev-duties-proposed-aug2024.png"},{"type":"p","html":"<em>Draft additional EU duty rates announced in August 2024, subject to revision; excludes the ordinary 10% tariff.</em>"},{"type":"p","html":"That creates an unusual situation. Trade restrictions intended to protect domestic manufacturers could also increase costs for Tesla’s international operations."},{"type":"p","html":"And even if tariffs make Chinese vehicles less competitive in the United States or Europe, they don’t eliminate the competition Tesla faces in China and other markets."},{"type":"p","html":"I don’t think American trade policy alone can solve that problem."},{"type":"p","html":"Chinese manufacturers have become competitive for reasons that extend beyond government support, and those advantages aren’t going to disappear simply because importing their vehicles becomes more expensive."}]},{"id":"tesla-chapter-4","title":"What I think happens next","words":256,"elements":[{"type":"p","html":"My expectation is that Tesla’s share price will become increasingly sensitive to political developments as the November election approaches."},{"type":"p","html":"I don’t necessarily expect that to translate into a sustained increase in the stock. Tesla’s automotive business faces real challenges, and some proposed policy changes could make those challenges more difficult."},{"type":"p","html":"But I think investors may begin paying greater attention to the potential value of Tesla’s future businesses, particularly autonomous driving, and how different regulatory environments might affect their development."},{"type":"p","html":"This is an important distinction because Tesla doesn’t need to demonstrate an immediate improvement in profitability for its valuation to change. Investors only need to revise their expectations about what the company might earn in the future."},{"type":"p","html":"Whether those expectations eventually prove justified is another question."},{"type":"p","html":"I also think there’s a risk in attaching too much importance to Musk’s political relationships. His interests and Tesla’s commercial interests aren’t necessarily identical, and political involvement can create uncertainty just as easily as it creates opportunities."},{"type":"p","html":"Still, I find it difficult to ignore how closely Tesla’s investment story is becoming connected to developments outside its existing automotive business."},{"type":"p","html":"The company will continue being judged on how many cars it sells and how profitably it manufactures them. But I suspect its share price will increasingly reflect expectations about technologies and regulatory developments whose economic value remains uncertain."},{"type":"p","html":"For a company already valued partly on what it might become, politics could add another layer to that uncertainty."},{"type":"p","html":"And that may be what makes Tesla particularly interesting to follow over the coming months."}]}]};
const US_RECESSION_HISTORICAL_ARTICLE={"id":"us-economy-2024","title":"Why I Remain Cautious About the US Economy in 2024","date":"26 oct 2023","totalWords":1187,"chapters":[{"id":"recession-introduction","title":"introduction","words":199,"elements":[{"type":"p","html":"I&#x27;ve been following the American economy&#x27;s response to higher interest rates for some time now, and I find its resilience increasingly difficult to explain. The Federal Reserve has raised borrowing costs at one of the fastest rates in decades, inflation has fallen considerably from its peak, and yet the economy continues to grow. Unemployment remains low, businesses are still hiring, and consumers have shown surprisingly little willingness to cut back on spending."},{"type":"p","html":"The latest employment figures make this particularly interesting. The economy <a href=\"https://www.bls.gov/news.release/archives/empsit_10062023.htm\" target=\"_blank\" rel=\"noopener\">added 336,000 jobs in September</a>, while unemployment remained at 3.8%. These are hardly the numbers one would expect from an economy that has spent the past eighteen months adjusting to substantially higher interest rates."},{"type":"p","html":"It&#x27;s understandable why economists have become more optimistic about a soft landing, where inflation returns to more manageable levels without a recession. There is certainly evidence supporting that possibility, and I wouldn&#x27;t dismiss it simply because previous tightening cycles have often ended badly."},{"type":"p","html":"Still, I find myself returning to a question that I don&#x27;t think the recent economic data fully answers. Has the American economy genuinely adjusted to higher interest rates, or have we simply not seen all their consequences yet?"}]},{"id":"recession-chapter-1","title":"The part of monetary policy we haven’t seen","words":230,"elements":[{"type":"p","html":"One thing I&#x27;ve come to appreciate about monetary policy is how unevenly its effects are distributed over time. Interest rates can change almost overnight, but the financial decisions they influence often take months or even years to adjust."},{"type":"p","html":"Consider a business that borrowed money in 2020 at a relatively low fixed interest rate. Its borrowing costs don&#x27;t necessarily change when the Federal Reserve raises rates. The problem only becomes apparent when the business needs additional financing or has to refinance its existing debt."},{"type":"p","html":"The same applies to households. Someone who secured a thirty-year fixed-rate mortgage a few years ago is largely protected from today&#x27;s higher mortgage rates. Someone trying to purchase a home now faces a very different financial calculation."},{"type":"p","html":"This distinction matters because it helps explain why the economy has remained relatively strong despite the Federal Reserve <a href=\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20230920a.htm\" target=\"_blank\" rel=\"noopener\">raising its benchmark interest-rate range to 5.25–5.50%</a>, compared with almost zero in early 2022."},{"type":"image","alt":"The rise in US interest rates: selected Federal Reserve policy decisions, March 2022–September 2023","src":"us-fed-rates-orange-2023.png"},{"type":"p","html":"<em>The rise in US interest rates. Target range upper bound, selected policy decisions.</em>"},{"type":"p","html":"Of course, this doesn&#x27;t mean higher interest rates will inevitably cause a recession. Much of the adjustment may already have happened, and strong household incomes could continue offsetting the pressure from more expensive borrowing."},{"type":"p","html":"But I suspect there&#x27;s still a meaningful amount of adjustment ahead of us, particularly for businesses that will eventually need to replace cheaper financing with more expensive debt."}]},{"id":"recession-chapter-2","title":"Where I think the real risk lies","words":258,"elements":[{"type":"p","html":"What concerns me more than interest rates themselves is how businesses and banks are beginning to respond to them."},{"type":"p","html":"The Federal Reserve&#x27;s <a href=\"https://www.federalreserve.gov/data/sloos/sloos-202307.htm\" target=\"_blank\" rel=\"noopener\">July survey of bank lending officers</a> found that banks had tightened lending standards for several types of loans, including lending to businesses and commercial real estate borrowers. Banks also reported weaker demand for credit."},{"type":"p","html":"At first glance, this might not seem particularly alarming. Banks becoming more cautious when borrowing costs are high is hardly surprising, and businesses postponing investments can simply be a sensible response to uncertainty."},{"type":"p","html":"But I think the interaction between these decisions is worth paying attention to."},{"type":"p","html":"Imagine a small business considering whether to open another location. Higher interest rates make the investment less attractive, while stricter lending requirements make it more difficult to finance. The business may remain profitable and have plenty of customers, but management might reasonably decide to wait another year before expanding."},{"type":"p","html":"There is nothing particularly concerning about one business making that decision. The difficulty arises when thousands of businesses begin thinking the same way."},{"type":"p","html":"Lower investment means less spending on construction, equipment, and services. Companies supplying those goods and services may then become more cautious about hiring. If employment growth begins slowing, households could reduce their spending, creating further pressure on businesses."},{"type":"p","html":"I think this is a more plausible route to recession than the idea that higher interest rates will suddenly cause widespread financial distress. The economy doesn&#x27;t need to experience a banking crisis for growth to weaken. A gradual reduction in spending and investment could be enough."}]},{"id":"recession-chapter-3","title":"The consumer is the difficult part of this prediction","words":227,"elements":[{"type":"p","html":"The strongest argument against my view is the American consumer."},{"type":"p","html":"Despite inflation and higher borrowing costs, households have continued spending, supported by a strong labor market and rising incomes. It&#x27;s difficult to argue convincingly for a recession while the largest component of the economy remains relatively healthy."},{"type":"p","html":"Households also entered this period with financial advantages that aren&#x27;t always captured by historical comparisons. Many homeowners have fixed-rate mortgages, while pandemic-era savings provided additional support for consumption."},{"type":"p","html":"Those savings have been declining. <a href=\"https://www.frbsf.org/research-and-insights/publications/economic-letter/2023/08/excess-no-more-dwindling-pandemic-savings/\" target=\"_blank\" rel=\"noopener\">Research published by the Federal Reserve Bank of San Francisco in August</a> estimated that a substantial portion of the excess savings accumulated during the pandemic had already been spent."},{"type":"p","html":"That doesn&#x27;t mean consumers are about to run out of money. Aggregate savings estimates are uncertain, and households can continue spending as long as employment and incomes remain strong."},{"type":"p","html":"But it does make the labor market particularly important."},{"type":"p","html":"If businesses begin reducing investment and hiring, household income growth could eventually weaken. Consumers who have already drawn down much of their additional savings may then become more cautious, especially if borrowing remains expensive."},{"type":"p","html":"The difficulty is that this process depends on employment weakening in the first place. As long as businesses continue hiring and real incomes improve, consumer spending may remain strong enough to prevent a recession."},{"type":"p","html":"I think that&#x27;s the central uncertainty in the outlook for next year."}]},{"id":"recession-chapter-4","title":"Why I’m still expecting a slowdown","words":273,"elements":[{"type":"p","html":"There are other reasons for caution, including the continued inversion of the Treasury yield curve, which has <a href=\"https://www.newyorkfed.org/research/capital_markets/ycfaq.html\" target=\"_blank\" rel=\"noopener\">historically preceded several American recessions</a>. I wouldn&#x27;t place too much weight on that indicator alone, since bond markets reflect many different expectations and historical patterns don&#x27;t always repeat themselves."},{"type":"p","html":"What matters more to me is how several developments fit together. Borrowing costs have risen substantially, banks are becoming more selective about lending, and businesses face stronger incentives to postpone investment. Meanwhile, households may have less room to absorb financial pressure than they did earlier in the recovery."},{"type":"p","html":"None of these developments guarantees a recession. Taken together, though, I think they make a downturn more plausible than the recent strength of employment and spending might suggest."},{"type":"p","html":"My expectation is that the United States will enter a mild recession during 2024, most likely through a gradual weakening of business investment, hiring, and consumer spending rather than a sudden financial crisis."},{"type":"p","html":"I could be underestimating how well the economy will adapt. Inflation has already moderated considerably, and if it continues declining while employment remains strong, the Federal Reserve may have room to ease monetary policy before economic conditions deteriorate substantially."},{"type":"p","html":"That would be a welcome outcome, and there&#x27;s a reasonable case for it."},{"type":"p","html":"Still, I think there&#x27;s a difference between an economy that has remained resilient despite higher interest rates and one that has fully adjusted to them. The recent data demonstrate the former, but I&#x27;m not yet convinced they establish the latter."},{"type":"p","html":"For now, that&#x27;s why I remain cautious about 2024."},{"type":"p","html":"<em>Historical forecast reconstructed using an October 25, 2023 information cutoff. Written retrospectively; not originally published in 2023.</em>"}]}]};
const NVIDIA_HISTORICAL_ARTICLE={"id":"nvidia-ai-boom-might-work-against-it","title":"Why Nvidia's AI Boom Might Eventually Work Against It","date":"15 feb 2023","totalWords":1054,"chapters":[{"id":"nvidia-introduction","title":"introduction","words":172,"elements":[{"type":"p","html":"I&#x27;ve been thinking about Nvidia&#x27;s position in the artificial intelligence industry, particularly since the release of ChatGPT a few months ago. It&#x27;s becoming increasingly clear that AI will require enormous amounts of computing power, and Nvidia happens to be one of the companies best positioned to provide it."},{"type":"p","html":"There&#x27;s a good reason for that. Nvidia&#x27;s graphics processing units, or GPUs, have become an important part of how AI models are developed. Its CUDA software platform also makes it easier for developers to use these processors, giving the company an advantage that goes beyond the hardware itself."},{"type":"p","html":"But there&#x27;s something interesting about Nvidia&#x27;s position. The more important AI becomes, the more money its largest customers have to spend on computing. And the more they spend, the greater their incentive to find alternatives."},{"type":"p","html":"I think this creates a problem for Nvidia over the longer term. Not because demand for its products will disappear, but because the very growth that makes its business attractive today could eventually make it harder to maintain its pricing power."}]},{"id":"nvidia-chapter-1","title":"The incentive to find an alternative","words":248,"elements":[{"type":"p","html":"Nvidia&#x27;s data-center business has already grown considerably. In the third quarter of its 2023 fiscal year, the company reported approximately $3.83 billion in data-center revenue, an increase of 31% from the previous year."},{"type":"image","alt":"Nvidia quarterly data-center revenue, Q4 FY22 to Q3 FY23","src":"nvidia-datacenter-2022.png"},{"type":"p","html":"<em>Source: Nvidia quarterly earnings releases, 2022. Data-center revenue includes activities beyond generative AI.</em>"},{"type":"p","html":"Some of Nvidia&#x27;s most important customers are companies like Amazon, Google, and Microsoft. These businesses have enormous computing requirements, substantial financial resources, and engineering teams capable of developing their own technology."},{"type":"p","html":"Google has already developed its Tensor Processing Units, while Amazon has introduced processors called Trainium and Inferentia. In October 2022, Amazon announced that its Trainium-based cloud instances could reduce training costs by as much as 50% compared with certain GPU-based alternatives."},{"type":"p","html":"Of course, that&#x27;s Amazon&#x27;s own claim, and it doesn&#x27;t mean its chips are better than Nvidia&#x27;s in every situation. But it illustrates something important. Nvidia&#x27;s customers aren&#x27;t necessarily content to remain dependent on Nvidia forever."},{"type":"p","html":"Imagine a company spending $100 million every year on computing infrastructure. If developing its own processors costs $30 million but saves $20 million annually, the initial investment could pay for itself in about eighteen months."},{"type":"p","html":"That&#x27;s a simplified example. In practice, developing chips involves considerable technical risk, software costs, and ongoing investment. But the underlying incentive is easy to understand. As spending increases, even relatively small savings become worth pursuing."},{"type":"p","html":"And if AI develops into an industry requiring hundreds of billions of dollars in computing infrastructure, I suspect these incentives will only become stronger."}]},{"id":"nvidia-chapter-2","title":"Not every AI application needs the same technology","words":166,"elements":[{"type":"p","html":"There are broadly two stages involved. The first is training, where a model learns from large amounts of data. The second is inference, where that trained model is used to answer questions, generate text, or perform other tasks."},{"type":"p","html":"Training sophisticated models requires enormous computing power, and Nvidia&#x27;s GPUs are particularly well suited to this work. Their flexibility, performance, and supporting software make them difficult to replace."},{"type":"p","html":"Inference can be different."},{"type":"p","html":"Once a model has been trained, some of the calculations involved in using it become more predictable. This creates opportunities for processors designed specifically for those tasks, potentially at a lower cost."},{"type":"p","html":"That doesn&#x27;t mean specialized chips will replace GPUs altogether. Different applications have different requirements, and Nvidia may continue to offer the best overall solution for many of them."},{"type":"p","html":"If alternative processors become sufficiently efficient for even a portion of the inference market, customers will have more options. And having more options generally makes it harder for any one supplier to charge a substantial premium."}]},{"id":"nvidia-chapter-3","title":"Why replacing Nvidia won't be easy","words":163,"elements":[{"type":"p","html":"Nvidia doesn&#x27;t simply sell processors. It has spent years developing CUDA, a software platform that allows programmers to use its hardware efficiently. Developers have built tools, libraries, and applications around it, and moving those systems to another architecture can be expensive and time-consuming."},{"type":"p","html":"A company might discover that another processor is cheaper on paper, only to find that the engineering work required to switch makes the savings disappear. Nvidia also continues to improve its products, meaning competitors have to catch up with a moving target."},{"type":"p","html":"Its H100 GPUs, which began shipping last year, are a good example of that continued progress."},{"type":"p","html":"I don&#x27;t expect these advantages to disappear anytime soon. In fact, they may allow Nvidia to remain the preferred supplier for the most demanding AI applications."},{"type":"p","html":"That distinction is important. Nvidia doesn&#x27;t need every customer to consider switching for its pricing power to come under pressure. A few very large customers with credible alternatives could already change the economics of the market."}]},{"id":"nvidia-chapter-4","title":"What this could mean for Nvidia","words":251,"elements":[{"type":"p","html":"I don&#x27;t think any of this suggests that Nvidia&#x27;s business is about to decline. Quite the opposite. AI could become an enormous source of revenue for the company over the coming years."},{"type":"p","html":"Nvidia could sell more processors, generate higher profits, and still find itself charging less for comparable computing performance as competition improves. Its margins might even remain healthy if manufacturing costs fall or its products become more efficient."},{"type":"p","html":"What concerns me is the assumption that today&#x27;s competitive advantages will allow Nvidia to capture an unusually large share of AI spending indefinitely."},{"type":"p","html":"Over the next three to five years, I expect Nvidia&#x27;s AI business to grow substantially. I also think there&#x27;s a reasonable chance that specialized processors and internally developed chips will begin weakening its pricing premiums, particularly in applications where computing requirements become more standardized."},{"type":"p","html":"That depends on alternatives becoming genuinely competitive after accounting for performance, software, and operating costs. If Nvidia continues improving faster than its competitors, the pressure could take much longer to emerge."},{"type":"p","html":"The more valuable AI becomes, the more valuable it becomes for companies to find cheaper ways of running it. Some will continue buying Nvidia&#x27;s products. Others will invest in alternatives. And even those that remain customers may gain negotiating power as the market develops."},{"type":"p","html":"Nvidia may end up being one of the biggest beneficiaries of artificial intelligence. I wouldn&#x27;t be surprised if it does."},{"type":"p","html":"But I wouldn&#x27;t assume that being essential to an industry today means being able to charge the same premium tomorrow."}]},{"id":"nvidia-chapter-5","title":"Contemporary references","words":54,"elements":[{"type":"list","items":["<a href=\"https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2023\" target=\"_blank\" rel=\"noopener\">Nvidia, Third Quarter Fiscal 2023 Results (November 16, 2022)</a>","<a href=\"https://press.aboutamazon.com/2022/10/aws-announces-general-availability-of-amazon-ec2-trn1-instances-powered-by-aws-designed-trainium-chips\" target=\"_blank\" rel=\"noopener\">Amazon, EC2 Trn1 General Availability (October 10, 2022)</a>","<a href=\"https://cloud.google.com/blog/topics/tpus/google-showcases-cloud-tpu-v4-pods-for-large-model-training\" target=\"_blank\" rel=\"noopener\">Google Cloud, TPU v4 Pods for Large Model Training (December 1, 2021)</a>"]},{"type":"p","html":"<em>Editorial note: This is a retrospectively written historical forecast using an information cutoff of February 14, 2023. It was not originally published in February 2023.</em>"}]}]};

function route(forced) {
  if (chapterRailCleanup) { chapterRailCleanup(); chapterRailCleanup = null; }
  let id = typeof forced === "string" ? forced : location.hash.slice(1);
  if (id.startsWith("notebook-")) {
    APP.innerHTML = notebookPage(id.slice(9));
    FOOT.hidden = false;
    document.body.classList.remove("home");
    document.title = BRAND; NAV_LINKS.forEach(a => a.classList.toggle("on", a.dataset.r === "bin"));
    window.scrollTo(0, 0); return;
  }
  if (id.startsWith("work-post-")) {
    const article=WORK_ARTICLES[id.slice(10)];
    if(article){ renderArticleRoute(article); return; }
  }
  if (id === "bin") id = "blog";
  if (id === "work") id = "work-fireplace";
  const p = POSTS.find(x => x.id === id);
  const pages = { "": home, [YEAR]: year, blog: () => blog(currentView), about, contact, projects: () => `<h1>projects</h1><p>coming soon &mdash; a showcase of things i've built and am building.</p><div class="label">currently learning</div><div class="tiles">` + CURRENT.map(tile).join("") + `</div><div class="linkrow"><a class="arrow-link" href="#activities">all activities &rarr;</a></div>`, videos: () => `<h1>videos</h1><p>coming soon &mdash; a collection of videos i've made or recommend.</p>`, cv: () => `<h1>get cv</h1><p>coming soon &mdash; my resume will be available for download here.</p>`, activities: () => `<h1>all activities</h1><p>coming soon &mdash; this will list everything you've started, archived, or plan to start.</p><p class="linkrow"><a class="arrow-link" href="#recommendations">any recommendation? &rarr;</a></p>`, recommendations: () => soon("any recommendation?") };
  WORK_SECTION_CONFIG.forEach(({key}) => { pages["work-" + key] = () => renderWorkSection(key); });
  APP.innerHTML = p ? post(p) : (pages[id] || home)();
  if (!p && WORK_NAV_KEYS.includes(id)) APP.insertAdjacentHTML("afterbegin", `<div class="work-tabs">${WORK_NAV_KEYS.map(w => `<a href="#${w}" class="${w === id ? "on" : ""}>${workIcon(w)}${w}</a>`).join("")}</div>`);
