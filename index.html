/* Cursor halo: desktop/fine pointers only */
@media (hover:hover) and (pointer:fine){
  .cursor-halo{position:fixed;left:-33px;top:-33px;width:66px;height:66px;z-index:10000;pointer-events:none;opacity:0;transform:translate3d(-100px,-100px,0);transition:opacity .12s ease;will-change:transform;contain:layout paint style}
  .cursor-halo.show{opacity:1;transition-duration:.2s}
  .cursor-halo svg{width:100%;height:100%;display:block;overflow:visible}
  .cursor-halo text{font-family:Inter,system-ui,sans-serif;font-size:9.5px;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;fill:var(--soft);transition:fill .18s ease,filter .18s ease}
  .cursor-halo.click text{font-size:8.5px;letter-spacing:1.7px;fill:#111;filter:drop-shadow(0 0 2px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(0,0,0,.25))}
  :root[data-theme="dark"] .cursor-halo.click text{fill:#fff;filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(255,255,255,.45))}
  .cursor-halo-dot{fill:var(--soft);opacity:.85;transition:fill .18s ease,filter .18s ease}
  .cursor-halo.click .cursor-halo-dot{fill:#111;filter:drop-shadow(0 0 2px rgba(0,0,0,.45))}
  :root[data-theme="dark"] .cursor-halo.click .cursor-halo-dot{fill:#fff;filter:drop-shadow(0 0 2px rgba(255,255,255,.75))}
}
@media (hover:none),(pointer:coarse),(prefers-reduced-motion:reduce){.cursor-halo{display:none!important}}


/* Shared long-form reading typography: About and full blog posts */
:root{--reading-font-size:1.125rem}

/* Work post preview grid */
.work-post-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px;margin-top:38px}
.work-post-card{display:block;color:var(--ink);text-decoration:none;min-width:0}
@media (prefers-reduced-motion:no-preference){
 .work-post-card{animation:card-in .32s var(--ease-out) both}
 .work-post-card:nth-child(2){animation-delay:40ms}.work-post-card:nth-child(3){animation-delay:70ms}
 .work-post-card:nth-child(4){animation-delay:95ms}.work-post-card:nth-child(5){animation-delay:115ms}
 .work-post-card:nth-child(n+6){animation-delay:130ms}
}
@keyframes card-in{from{opacity:0;transform:translateY(8px)}}
.work-post-thumb{width:100%;aspect-ratio:4/5;display:block;object-fit:cover;border-radius:8px;background:var(--card);border:1px solid var(--line);transition:transform .2s var(--ease-out),border-color .18s ease,background .18s ease}

@media (max-width:680px){.work-post-grid{grid-template-columns:1fr;gap:26px;margin-top:30px}}

.work-article{position:relative}
.work-article .prose{margin:0 auto;font-size:16px}
.work-article .prose h1{margin-bottom:8px}
.work-article .article-date{color:var(--soft);font-size:.8rem;margin-bottom:28px}
.work-article .chapter{scroll-margin-top:110px}
.work-article .chapter h2{font-size:1.05rem;font-weight:600;margin:34px 0 10px;line-height:1.4}
.chapter-rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:220px;color:var(--soft);z-index:80}
.chapter-rail-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase}
.chapter-rail-head button,.chapter-link{font:inherit;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chapter-rail-head button{color:var(--soft);letter-spacing:inherit;text-transform:inherit}
.chapter-rail-list{position:relative;display:flex;flex-direction:column;gap:15px}
.chapter-rail-list::before{display:none}.chapter-link:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:7px;height:calc(100% + 15px);width:1px;background:var(--soft);opacity:.55;z-index:0}
.chapter-link{position:relative;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start;color:var(--soft);font-size:.82rem;line-height:1.35;width:100%}
.chapter-dot{width:10px;height:10px;border:1.5px solid var(--soft);border-radius:50%;background:var(--bg);margin-top:2px;z-index:1;transition:background .18s,border-color .18s,box-shadow .18s}
.chapter-link.on{color:#111;font-weight:500;text-shadow:0 0 2px rgba(0,0,0,.32),0 0 8px rgba(0,0,0,.18)}
.chapter-link.on .chapter-dot{background:#111;border-color:#111;box-shadow:0 0 3px rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.24)}
:root[data-theme="dark"] .chapter-link.on{color:#fff;text-shadow:0 0 2px rgba(255,255,255,.75),0 0 8px rgba(255,255,255,.35)}
:root[data-theme="dark"] .chapter-link.on .chapter-dot{background:#fff;border-color:#fff;box-shadow:0 0 3px rgba(255,255,255,.75),0 0 8px rgba(255,255,255,.38)}
.chapter-words{opacity:.8;font-weight:400}
@media (hover:hover){.chapter-link:hover,.chapter-rail-head button:hover{color:var(--ink)}}
@media (max-width:1050px){.chapter-rail{display:none}}


.work-article .article-figure{margin:28px 0 8px}
.work-article .article-figure img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.work-article .article-source{font-size:.78rem;color:var(--soft);margin-top:6px}
.work-article .article-list{padding-left:20px;margin:0 0 16px}
.work-article .article-list li{margin-bottom:8px}


.work-article .prose a{color:var(--soft);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
@media (hover:hover){.work-article .prose a:hover{color:var(--ink)}}

.article-table-wrap{overflow-x:auto;margin:20px 0 18px}
.article-table{width:100%;border-collapse:collapse;font-size:.88rem}
.article-table th,.article-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.article-table th{font-weight:600;color:var(--ink)}
.article-table td{color:var(--soft)}


.article-subhead{font-size:.95rem;font-weight:600;margin:24px 0 10px}

/* Clearline article — reference-inspired screenshot/text rows */
.work-article.clearline-article .prose{line-height:1.62}
.work-article.clearline-article .chapter{display:block}
.work-article.clearline-article .chapter p{margin:0 0 16px}
.work-article.clearline-article .clearline-feature-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:center;margin:22px 0 26px;clear:both}
.work-article.clearline-article .clearline-feature-row .article-figure{float:none;width:190px;max-width:none;height:176px;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.work-article.clearline-article .clearline-feature-row .article-figure img{width:100%;height:100%;max-height:none;object-fit:cover;object-position:50% 22%;border:0;border-radius:0}
.work-article.clearline-article .clearline-feature-copy p:last-child{margin-bottom:0}
.work-article.clearline-article .clearline-feature-copy .article-subhead{margin:0 0 8px}
.work-article.clearline-article .clearline-feature-row:nth-of-type(even){grid-template-columns:minmax(0,1fr) 190px}
.work-article.clearline-article .clearline-feature-row:nth-of-type(even) .article-figure{grid-column:2}
.work-article.clearline-article .clearline-feature-row:nth-of-type(even) .clearline-feature-copy{grid-column:1;grid-row:1}
.work-article.clearline-article .clearline-wide-figure{width:min(100%,520px);margin:22px auto 26px}
.work-article.clearline-article .clearline-wide-figure .article-figure{float:none;width:100%;max-width:none;margin:0}
.work-article.clearline-article .clearline-wide-figure .article-figure img{width:100%;height:auto;max-height:280px;object-fit:cover;object-position:center;border-radius:8px}
@media (max-width:680px){
 .work-article.clearline-article .clearline-feature-row{grid-template-columns:1fr;gap:12px;margin:20px 0 24px}
 .work-article.clearline-article .clearline-feature-row .article-figure{width:min(240px,72vw);height:190px;margin:0 auto}
 .work-article.clearline-article .clearline-feature-row:nth-of-type(even){grid-template-columns:minmax(0,1fr)}
 .work-article.clearline-article .clearline-feature-row:nth-of-type(even) .article-figure{grid-column:1}
 .work-article.clearline-article .clearline-feature-row:nth-of-type(even) .clearline-feature-copy{grid-column:1;grid-row:auto}
 .work-article.clearline-article .clearline-feature-copy{text-align:left}
}
/* ---------- homepage: bottom row, cue, closing row ---------- */
.hero-foot{position:absolute;left:24px;right:24px;top:calc(100vh - 24px);top:calc(100svh - 24px);transform:translateY(-100%);display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:50}
.hero-foot .hero-where,.hero-foot .hero-actions{position:static;transform:none;left:auto;right:auto;top:auto}
.for-intro em.intro-em{color:var(--soft)}
.hx-picked{scroll-margin-top:88px;padding-top:64px}
@media (max-width:680px){
  .hero{min-height:calc(100svh - 61px);padding-top:28px;padding-bottom:96px;position:relative}
  .hero-foot{left:0;right:0;top:auto;bottom:16px;transform:none;flex-wrap:wrap;justify-content:space-between}
  .hero-foot .hero-where{margin:0}.hero-foot .hero-actions{margin:0;flex-direction:row}
}
@media (max-width:400px){
  .for-bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:18px;margin-left:-20px;margin-right:-20px;padding:13px 20px;margin-top:-13px}
  .for-bar::-webkit-scrollbar{display:none}
  .for-bar button{margin:-13px 0;white-space:nowrap}
}
/* ---------- homepage: particles and picks ---------- */
.spores{opacity:0;transition:opacity .8s ease}
.spores.on{opacity:1}
.for-intro .intro-em{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-style:normal;font-weight:400;font-size:.84em;letter-spacing:-.02em;transform:none;display:inline}
.for-intro a.intro-em{text-underline-offset:5px}
.hx-picked{padding-bottom:40px}
.hx-picked h2{font-size:clamp(1.4rem,2.2vw,1.8rem);font-weight:700;letter-spacing:-.01em;margin:0 0 20px}
.hx-picked h2 b{font-weight:700}
.hx-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.hx-card{display:block;text-decoration:none;color:var(--ink)}
.hx-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--card);display:block;transition:transform .3s var(--ease-out)}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){.hx-card:hover img{transform:translateY(-3px)}}
.hx-card .meta{font-size:.8rem;color:var(--soft);margin:12px 0 4px}
.hx-card .ttl{font-weight:600;font-size:1.02rem;line-height:1.35}
@media (max-width:680px){.hx-cards{grid-template-columns:1fr;gap:28px}.hx-picked{padding-top:48px}}

    body: "I have been a long-time subscriber of **Reysu (Eric Su)** on YouTube. His approach to documenting his life and work eventually made me want to build a website of my own.\n\nAt the time of writing this, my website is a near-exact imitation of his, and I intend to keep it that way for the foreseeable future. I could spend weeks designing my own website, but honestly, that feels like a side-quest. Besides, the website itself isn't really the point. I want to turn it into a **record of how I figure things out.**\n\n## A Personal Laboratory\n\nThere are countless things I want to change about the way I live: how I exercise, how I organize my time, what I eat, and what I pay attention to.\n\nI try things all the time. The problem is, I rarely keep track of them.\n\nWe all start a new habits, try some productivity system we found online, change the way we work for a few weeks, and eventually move on. A few months later, we remember that we tried *something*, but not why we tried it, what happened, or why we stopped.\n\nI want this website to keep that record. When I try something new, I want to be able to write down what it is, where I found it, why I'm trying it, what happened, and whether I ended up keeping it. Some things will work. Some won't. That's part of the experiment.\n\n## Learning From My Own History\n\nI also want to be able to look back. It's surprisingly easy to forget how different your life was a year ago. You remember where you are now, but not always how you got there.\n\nWriting things down gives me a way to see that. I can look back at what I tried, what I abandoned, what stuck, and what I eventually came back to. Hopefully, that means I can learn from previous versions of myself instead of repeatedly starting from zero.\n\n## From Imitation to Adaptation\n\nI'm also interested in what happens between copying something and making it your own.\n\n**Imitation → Emulation → Adaptation → Innovation.**\n\nI can copy something, figure out why it works, change what doesn't fit, and eventually arrive at something that works for me.\n\nThat's the process I want this website to document.\n\n## What This Website Is For\n\nSo this isn't meant to be a collection of definitive advice. It's a record of my experiments. And progress rarely looks like a straight line when you're actually living through it. It's mostly trying things, changing your mind, keeping what works, and throwing away what doesn't. Maybe years from now I'll have a fairly coherent system for how I live and work. Or maybe I'll just have a very long list of things I tried and discarded.\n\nEither way, **I'll have the record.**" }

function daysIn(start) {

  const now = new Date();
  const diff = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 86400000);
  if (diff < 0) return diff === -1 ? "starts tomorrow" : `starts in ${-diff} days`;
  if (diff === 0) return "started today";

}

let forBarCleanup = null;
function initForBar() {
  if (forBarCleanup) { forBarCleanup(); forBarCleanup = null; }
  const bar = document.querySelector(".for-bar");
  if (!bar) return;
  const intro = document.querySelector(".for-intro");
  const tabs = [...bar.querySelectorAll("button[data-for]")];
  // Reserve the longest intro height so switching audiences never shifts the page.
  const fit = () => {
    const curHTML = intro.innerHTML;
    intro.style.minHeight = "0px";
    let h = 0;
    FOR_CATEGORIES.forEach(c => {
      intro.textContent = c.text;
      h = Math.max(h, intro.offsetHeight);
    });
    intro.innerHTML = curHTML;
    intro.style.minHeight = h + "px";
  };
  let shown = forLocked;
  const activate = i => {
    if (i !== shown) {
      intro.innerHTML = formatForIntro(FOR_CATEGORIES[i].text);
      intro.animate(REDUCED_MOTION.matches
        ? [{ opacity: .5 }, { opacity: 1 }]
        : [{ opacity: .35, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0)" }],
        { duration: 200, easing: "cubic-bezier(.23,1,.32,1)" });
      shown = i;
    }
    tabs.forEach((tab,k) => tab.classList.toggle("active", k === i));
  };
  const select = i => {
    forLocked = i; activate(i);
    tabs.forEach((tab,k) => { tab.tabIndex = k === i ? 0 : -1; tab.setAttribute("aria-selected", k === i); });
    intro.setAttribute("aria-labelledby", tabs[i].id);
    // the picks below the fold follow the chosen audience
    const cards = document.querySelector(".hx-cards");
    if (cards) cards.innerHTML = audCards(i);
    document.querySelectorAll("[data-aud-name]").forEach(n => { n.textContent = AUDIENCES[i].label; });
  };
  const onKey = e => {
    const n = tabs.length, keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    let i = forLocked;
    if (e.key in keys) i = (forLocked + keys[e.key] + n) % n;
    else if (e.key === "Home") i = 0; else if (e.key === "End") i = n - 1; else return;
    e.preventDefault(); select(i); tabs[i].focus();
  };
  bar.addEventListener("keydown", onKey);
  const handlers = tabs.map(tab => {
    const enter = () => activate(+tab.dataset.for);
    const leave = () => activate(forLocked);
    const click = () => select(+tab.dataset.for);
    tab.addEventListener("mouseenter", enter);
    tab.addEventListener("mouseleave", leave);
    tab.addEventListener("click", click);
    return [tab, enter, leave, click];
  });
  const ro = new ResizeObserver(fit);
  ro.observe(bar);
  fit();
  forBarCleanup = () => {
    ro.disconnect();
    bar.removeEventListener("keydown", onKey);

      tab.removeEventListener("mouseleave", leave);
      tab.removeEventListener("click", click);
    });
  };
}

// ---------- articles: written in Pages CMS as _articles/*.md, built by GitHub Pages ----------
// /articles/index.json lists them, /articles/sections.json lists the sections,
// and each article body is a bare HTML fragment at /a/<id>.html.
let ARTICLE_INDEX = {};
const slugify = t => String(t).toLowerCase().replace(/&[a-z]+;/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// turn the CMS's plain HTML into the site's article markup, split into chapters at each h2
function buildArticle(meta, html) {
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("p").forEach(pEl => {
    const img = pEl.querySelector("img");
    if (img && pEl.textContent.trim() === "" && pEl.children.length === 1) {
      const fig = document.createElement("figure"); fig.className = "article-figure";
      img.loading = "lazy"; img.decoding = "async"; fig.appendChild(img); pEl.replaceWith(fig);
    }
  });
  box.querySelectorAll("table").forEach(t => {
    t.className = "article-table";
    const wrap = document.createElement("div"); wrap.className = "article-table-wrap";
    t.replaceWith(wrap); wrap.appendChild(t);
  });
  box.querySelectorAll("ul,ol").forEach(l => l.classList.add("article-list"));
  box.querySelectorAll("h3").forEach(h => h.classList.add("article-subhead"));
  box.querySelectorAll("a[href]").forEach(a => { if (/^https?:/.test(a.getAttribute("href"))) { a.target = "_blank"; a.rel = "noopener"; } });
  const chapters = [];
  let cur = { title: "introduction", nodes: [] };
  [...box.childNodes].forEach(node => {
    if (node.nodeType === 1 && node.tagName === "H2") {
      if (cur.nodes.some(x => x.nodeType === 1 || (x.textContent || "").trim())) chapters.push(cur);
      cur = { title: node.textContent.trim(), nodes: [], heading: true };
    } else cur.nodes.push(node);
  });
  chapters.push(cur);
  let total = 0;
  const parts = chapters.map((c, i) => {
    const sec = document.createElement("section");
    sec.className = "chapter";
    sec.id = `${meta.id}-${slugify(c.title) || "part-" + i}`;
    if (c.heading) { const h = document.createElement("h2"); h.textContent = c.title; sec.appendChild(h); }
    c.nodes.forEach(x => sec.appendChild(x));
    const words = countWords(sec) - (c.heading ? (c.title.match(/\S+/g) || []).length : 0);
    total += words;
    return { id: sec.id, title: c.title, words, html: sec.outerHTML };
  });
  const rail = `<aside class="chapter-rail" aria-label="chapters"><div class="chapter-rail-head"><button type="button" data-top-link>chapters</button><span>${total} words</span></div><div class="chapter-rail-list">` +
    parts.map(c => `<button type="button" class="chapter-link" data-chapter="${c.id}"><span class="chapter-dot"></span><span>${esc(c.title)} <span class="chapter-words">(${c.words} words)</span></span></button>`).join("") + `</div></aside>`;
  return `<div class="work-article ${meta.id === "clearline-why-i-built-it" ? "clearline-article" : ""}">${rail}<article class="prose"><h1>${esc(meta.title)}</h1><div class="article-date">${esc(meta.display)} · ${total} words</div>${parts.map(c => c.html).join("")}</article></div>`;
}

const REDUCED_MOTION = matchMedia("(prefers-reduced-motion:reduce)");
const DARK_SCHEME = matchMedia("(prefers-color-scheme:dark)");
function setTheme(t, save, e) {
  const sw = document.getElementById("theme");
  const apply = () => { document.documentElement.dataset.theme = t; sw.setAttribute("aria-checked", t === "dark"); document.dispatchEvent(new Event("themechange")); };
  if (save) { try { localStorage.setItem("theme", t); } catch(ex){} }
  const reduce = REDUCED_MOTION.matches;
  if (!save || !e || !document.startViewTransition || reduce) { apply(); return; }
  const r = sw.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => {
    document.documentElement.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
      { duration: THEME_MS, easing: THEME_EASE, pseudoElement: "::view-transition-new(root)" }
    );
  });
}

function setupClearlineLayout(){
 const article=document.querySelector(".work-article.clearline-article");
 if(!article)return;
 const figures=[...article.querySelectorAll(".article-figure")];
 figures.forEach(fig=>{
   const img=fig.querySelector("img"); if(!img)return;
   const src=img.getAttribute("src")||"";
   if(src.includes("clearline-windows")||src.includes("clearline-sync")){
     const wide=document.createElement("div");wide.className="clearline-wide-figure";
     fig.parentNode.insertBefore(wide,fig);wide.appendChild(fig);return;
   }
   const subhead=fig.previousElementSibling&&fig.previousElementSibling.matches(".article-subhead")?fig.previousElementSibling:null;
   const row=document.createElement("div");row.className="clearline-feature-row";
   const copy=document.createElement("div");copy.className="clearline-feature-copy";
   const parent=fig.parentNode;
   if(subhead)parent.insertBefore(row,subhead);else parent.insertBefore(row,fig);
   row.appendChild(fig);row.appendChild(copy);
   if(subhead)copy.appendChild(subhead);
   let n=row.nextSibling,moved=0;
   while(n&&moved<2){
     const next=n.nextSibling;
     if(n.nodeType===1&&n.matches("p")){copy.appendChild(n);moved++;}
     else if(n.nodeType===3&&!n.textContent.trim()){}
     else break;
     n=next;
   }
 });
}
let chapterRailCleanup = null;
function setupChapterRail(){

 const rail=document.querySelector(".chapter-rail"); if(!rail)return;

 const sections=links.map(a=>document.getElementById(a.dataset.chapter)).filter(Boolean);
 if(!sections.length)return;
 let ticking=false;
 const update=()=>{
   ticking=false;
   let active=sections[0];
   const atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4;
   if(atBottom){active=sections[sections.length-1];}
   else{for(const section of sections){if(section.getBoundingClientRect().top<=150)active=section;else break;}}
   links.forEach(a=>a.classList.toggle("on",a.dataset.chapter===active.id));
 };
 const onScroll=()=>{if(!ticking){ticking=true;requestAnimationFrame(update);}};
 const onClick=e=>{
   const b=e.target.closest("button");if(!b)return;
   if(b.hasAttribute("data-top-link"))window.scrollTo({top:0,behavior:"smooth"});
   else if(b.dataset.chapter){const el=document.getElementById(b.dataset.chapter);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
 };

 window.addEventListener("scroll",onScroll,{passive:true});
 chapterRailCleanup=()=>{rail.removeEventListener("click",onClick);window.removeEventListener("scroll",onScroll);};
 update();
}

<script>
(() => {
  const finePointer=window.matchMedia('(hover:hover) and (pointer:fine)');
  if (!finePointer.matches || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const halo = document.getElementById('cursorHalo');
  const ring = document.getElementById('cursorHaloRing');
  const textPath = halo.querySelector('textPath');
  const actionable = 'a,button,[role="button"],[role="switch"],[role="tab"],input,select,textarea,.lt-dot,[tabindex]:not([tabindex="-1"])';
  let x = -100, y = -100, angle = 0, lastX = null, lastY = null, clicking = false, lastT = performance.now(), raf = 0;
  // spring state for the ring position (decorative, so it may trail the real pointer slightly)
  let px = -100, py = -100, vx = 0, vy = 0;
  const STIFF = 0.3, DAMP = 0.58;
  const draw = () => ring.setAttribute('transform', `rotate(${angle} 50 50)`);
  const spin = () => { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } };
  const moveRate = 0.58;       // degrees per pixel of pointer travel
  const clickRate = 38;        // degrees per second

  function setMode(target){
    const isClick = !!(target && target.closest && target.closest(actionable));
    if (isClick !== clicking){
      clicking = isClick;
      halo.classList.toggle('click', clicking);
      textPath.textContent = clicking ? 'CLICK · CLICK · CLICK · CLICK · ' : 'MOVE · MOVE · MOVE · MOVE · ';
      textPath.setAttribute('textLength', '213');
      if (clicking) spin();
    }
  }

  document.addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    if (!halo.classList.contains('show')) { px = x; py = y; vx = vy = 0; halo.style.transform = `translate3d(${x}px,${y}px,0)`; }
    halo.classList.add('show');
    spin();
    setMode(e.target);
    if (!clicking && lastX !== null){
      angle += Math.hypot(x - lastX, y - lastY) * moveRate;
    }
    lastX = x; lastY = y;
  }, {passive:true});

  document.addEventListener('pointerover', e => setMode(e.target), {passive:true});
  document.addEventListener('pointerleave', () => halo.classList.remove('show'));
  window.addEventListener('blur', () => halo.classList.remove('show'));

  function frame(now){
    const dt = Math.min((now - lastT) / 1000, .05);
    lastT = now;
    if (clicking) angle += clickRate * dt;
    vx = (vx + (x - px) * STIFF) * DAMP; vy = (vy + (y - py) * STIFF) * DAMP;
    px += vx; py += vy;
    const settled = Math.abs(x - px) < .1 && Math.abs(y - py) < .1 && Math.abs(vx) < .1 && Math.abs(vy) < .1;
    if (settled) { px = x; py = y; }
    halo.style.transform = `translate3d(${px}px,${py}px,0)`;
    draw();
    raf = ((clicking || !settled) && !document.hidden) ? requestAnimationFrame(frame) : 0;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && clicking) spin(); });
})();
</script>
