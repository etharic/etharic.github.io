    document.querySelectorAll(".seg button").forEach(b => { b.onclick = () => { currentView = b.dataset.v; route("blog"); }; });
  }
  document.title = p ? p.title + " | " + BRAND : BRAND;
  NAV_LINKS.forEach(a => a.classList.toggle("on", a.dataset.r === id || ((!!p || WORK_NAV_KEYS.includes(id)) && a.dataset.r === "bin") || (id.startsWith("work-") && a.dataset.r === "work")));
  window.scrollTo(0, 0);
}

const THEME_MS = 420, THEME_EASE = "cubic-bezier(.4,0,.2,1)";
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion:reduce)");
const DARK_SCHEME = matchMedia("(prefers-color-scheme:dark)");
function setTheme(t, save, e) {
  const sw = document.getElementById("theme");
  const apply = () => { document.documentElement.dataset.theme = t; sw.setAttribute("aria-checked", t === "dark"); };
  if (save) { try { localStorage.setItem("theme", t); } catch(ex){} }
  const reduce = REDUCED_MOTION.matches;
  if (!save || !e || !document.startViewTransition || reduce) { apply(); return; }
  const r = sw.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => {
    document.documentElement.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
      { duration: THEME_MS, easing: THEME_EASE, pseudoElement: "::view-transition-new(root)" }
    );
  });
}

function dogSvg() {
  const layer = rows => { let r = ""; rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === "#" || c === "+") r += `<rect x="${x*2}" y="${y*2}" width="2" height="2"${c === "+" ? ' opacity=".55"' : ""}/>`; })); return r; };
  return `<svg class="dog" data-f="0" width="28" height="30" viewBox="0 0 28 30" fill="currentColor" aria-hidden="true"><g class="base">${layer(DOG.base)}</g><g class="down">${layer(DOG.down)}</g><g class="up1">${layer(DOG.up1)}</g><g class="up2">${layer(DOG.up2)}</g></svg>`;
}
function animateDog() {
  if (REDUCED_MOTION.matches) return;
  const set = f => document.querySelectorAll(".dog").forEach(d => { d.dataset.f = f; });
  const seq = [1, 2, 1, 2, 1, 2, 1, 2, 1, 2];
  let i = 0;
  (function step() {
    if (i >= seq.length) { set("0"); i = 0; setTimeout(step, 2800); return; }
    set(String(seq[i++]));
    setTimeout(step, 130);
  })();
}
function tick() {

function setupClearlineLayout(){
 const article=document.querySelector(".work-article.clearline-article");
 if(!article)return;
 const figures=[...article.querySelectorAll(".article-figure")];
 figures.forEach(fig=>{
   const img=fig.querySelector("img"); if(!img)return;
   const src=img.getAttribute("src")||"";
   if(src.includes("clearline-windows")||src.includes("clearline-sync")){
     const wide=document.createElement("div");wide.className="clearline-wide-figure";
     fig.parentNode.insertBefore(wide,fig);wide.appendChild(fig);return;
   }
   const subhead=fig.previousElementSibling&&fig.previousElementSibling.matches(".article-subhead")?fig.previousElementSibling:null;
   const row=document.createElement("div");row.className="clearline-feature-row";
   const copy=document.createElement("div");copy.className="clearline-feature-copy";
   const parent=fig.parentNode;
   if(subhead)parent.insertBefore(row,subhead);else parent.insertBefore(row,fig);
   row.appendChild(fig);row.appendChild(copy);
   if(subhead)copy.appendChild(subhead);
   let n=row.nextSibling,moved=0;
   while(n&&moved<2){
     const next=n.nextSibling;
     if(n.nodeType===1&&n.matches("p")){copy.appendChild(n);moved++;}
     else if(n.nodeType===3&&!n.textContent.trim()){}
     else break;
     n=next;
   }
 });
}
let chapterRailCleanup = null;
function setupChapterRail(){
 if(chapterRailCleanup){chapterRailCleanup();chapterRailCleanup=null;}
 const rail=document.querySelector(".chapter-rail"); if(!rail)return;
 const links=[...rail.querySelectorAll("[data-chapter]")];
 const sections=links.map(a=>document.getElementById(a.dataset.chapter)).filter(Boolean);
 if(!sections.length)return;
 let ticking=false;
 const update=()=>{
   ticking=false;
   let active=sections[0];
   const atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4;
   if(atBottom){active=sections[sections.length-1];}
   else{for(const section of sections){if(section.getBoundingClientRect().top<=150)active=section;else break;}}
   links.forEach(a=>a.classList.toggle("on",a.dataset.chapter===active.id));
 };
 const onScroll=()=>{if(!ticking){ticking=true;requestAnimationFrame(update);}};
 const onClick=e=>{
   const b=e.target.closest("button");if(!b)return;
   if(b.hasAttribute("data-top-link"))window.scrollTo({top:0,behavior:"smooth"});
   else if(b.dataset.chapter){const el=document.getElementById(b.dataset.chapter);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
 };
 rail.addEventListener("click",onClick);
 window.addEventListener("scroll",onScroll,{passive:true});
 chapterRailCleanup=()=>{rail.removeEventListener("click",onClick);window.removeEventListener("scroll",onScroll);};
 update();
}

document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.pushState(null, "", "#" + id); } catch (err) {}
  route(id);
});

<script>
(() => {
  const finePointer=window.matchMedia('(hover:hover) and (pointer:fine)');
  if (!finePointer.matches) return;
  const halo = document.getElementById('cursorHalo');
  const ring = document.getElementById('cursorHaloRing');
  const textPath = halo.querySelector('textPath');
  const actionable = 'a,button,[role="button"],[role="switch"],input,select,textarea,.for-bar span,.lt-dot,[tabindex]:not([tabindex="-1"])';
  let x = -100, y = -100, angle = 0, lastX = null, lastY = null, clicking = false, lastT = performance.now();
  const moveRate = 0.58;       // degrees per pixel of pointer travel
  const clickRate = 38;        // degrees per second

  function setMode(target){
    const isClick = !!(target && target.closest && target.closest(actionable));
    if (isClick !== clicking){
      clicking = isClick;
      halo.classList.toggle('click', clicking);
      textPath.textContent = clicking ? 'CLICK · CLICK · CLICK · CLICK · ' : 'MOVE · MOVE · MOVE · MOVE · ';
      textPath.setAttribute('textLength', '213');
    }
  }

  document.addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    halo.style.left = x + 'px';
    halo.style.top = y + 'px';
    halo.classList.add('show');
    setMode(e.target);
    if (!clicking && lastX !== null){
      angle += Math.hypot(x - lastX, y - lastY) * moveRate;
    }
    lastX = x; lastY = y;
  }, {passive:true});

  document.addEventListener('pointerover', e => setMode(e.target), {passive:true});
  document.addEventListener('pointerleave', () => halo.classList.remove('show'));
  window.addEventListener('blur', () => halo.classList.remove('show'));

  function frame(now){
    const dt = Math.min((now - lastT) / 1000, .05);
    lastT = now;
    if (clicking) angle += clickRate * dt;
    ring.setAttribute('transform', `rotate(${angle} 50 50)`);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
