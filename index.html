<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etharic</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f1f3;--card:#f8f9fa;--ink:#1d1e22;--soft:#6b6f7a;--line:#dcdee3;--on:#34c759;--hover:rgba(29,30,34,.05)}
:root[data-theme="dark"]{--bg:#151515;--card:#20201f;--ink:#f2f2f1;--soft:#9d9d9b;--line:#373736;--hover:rgba(242,242,241,.07)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:0 20px;flex:1;display:flex;flex-direction:column;width:100%}
main{flex:1;padding-bottom:48px}
nav{position:fixed;top:0;left:0;width:100%;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:30px 102px 30px 24px;z-index:100;background:var(--bg)}
body:not(.home) .wrap{padding-top:88px}
nav a{color:var(--ink);text-decoration:none;font-size:.95rem}
nav .logo{font-weight:600;font-size:1.1rem;letter-spacing:-.01em}
nav .right{display:flex;flex-direction:row;align-items:center;gap:24px}
nav .right a{color:var(--soft);display:inline-flex;align-items:center;gap:6px}
.ico{width:16px;height:16px;flex:none}
nav .right a.on{color:var(--ink)}
.more-about{display:inline-flex;align-self:flex-end;align-items:center;gap:6px;margin-top:8px;color:var(--soft);text-decoration:none;font-size:.95rem;transition:color .18s}
.more-about span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
@media (hover:hover){.more-about:hover{color:var(--ink)}}
.work-tabs{display:flex;gap:24px;margin-top:30px;flex-wrap:wrap}
.work-side{position:fixed;top:128px;left:24px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;z-index:90}
.work-side a{color:var(--soft);display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.95rem}
.work-side a.on{color:var(--ink)}
@media (hover:hover){.work-side a:hover{color:var(--ink)}}
@media (max-width:1100px){.work-side{position:static;flex-direction:row;flex-wrap:wrap;gap:24px;margin-top:30px}}
.work-tabs a{color:var(--soft);display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.95rem}
.work-tabs a.on{color:var(--ink)}
@media (hover:hover){.work-tabs a:hover{color:var(--ink)}}
@media (hover:hover){nav .right a:hover{color:var(--ink)}}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.switch{width:48px;height:27px;border-radius:999px;border:0;background:#3a3a40;position:fixed;top:30px;right:30px;cursor:pointer;padding:0;transition:background .42s cubic-bezier(.4,0,.2,1);z-index:200;view-transition-name:theme-switch}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .42s cubic-bezier(.4,0,.2,1)}
.switch[aria-checked="true"]{background:var(--on)}
.switch[aria-checked="true"]::after{transform:translateX(21px)}
.sw{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.5;transition:opacity .2s}
.sw.sun{left:7px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(theme-switch){display:none}
::view-transition-new(theme-switch){animation:none}
::view-transition-group(theme-switch){animation:none}
.sw.moon{right:7px;stroke:#b7b9c2}
.switch[aria-checked="false"] .sun,.switch[aria-checked="true"] .moon{opacity:0}
h1{font-size:2.2rem;line-height:1.2;margin:40px 0 12px;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 14px;color:var(--soft)}
main p a,.link{color:var(--ink)}
.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:400;margin:64px 0 16px}
.hero{isolation:isolate;display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 60px);margin-top:0;padding-top:60px}
.hero h1{margin:8px 0 24px;font-size:3rem}
.spores{position:absolute;z-index:0;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 58% 34% at center,#000 42%,rgba(0,0,0,.82) 58%,rgba(0,0,0,.30) 74%,transparent 100%);mask-image:radial-gradient(ellipse 58% 34% at center,#000 42%,rgba(0,0,0,.82) 58%,rgba(0,0,0,.30) 74%,transparent 100%)}
.hero>h1,.hero>.for-bar,.hero>.for-intro,.hero>.more-about{position:relative;z-index:1}
.intro{line-height:1.8}
.for-bar{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.for-bar span{color:var(--soft);cursor:pointer;font-size:.85rem;transition:color .18s}
.for-bar span:hover,.for-bar span.active{color:var(--ink);font-weight:600}
.for-intro{font-size:1.6rem;line-height:1.5;font-weight:400;min-height:3.2em;color:var(--ink)}
.hero-where{position:absolute;left:24px;top:calc(100vh - 30px);transform:translateY(-100%);display:flex;align-items:center;gap:8px;min-height:30px;color:var(--soft);font-size:.95rem;z-index:50}
.hero-actions{position:absolute;right:30px;top:calc(100vh - 30px);transform:translateY(-100%);display:flex;flex-direction:column;align-items:flex-end;gap:20px;z-index:50}
.hero-actions a{color:#cf8c06;display:inline-flex;align-items:center;min-height:30px;gap:6px;text-decoration:none;font-size:.95rem;transition:color .18s}
@media (hover:hover){.hero-actions a:hover{color:var(--ink)}}
.btn{display:inline-block;border:1px solid var(--line);color:var(--ink);padding:8px 16px;border-radius:8px;text-decoration:none;font-size:.85rem;background:var(--card);transition:background .18s,border-color .18s,color .18s,transform .12s}
@media (hover:hover){.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--bg);transform:translateY(-1px)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--soft);background:var(--card);color:var(--soft);font-size:.8rem;padding:8px}
.cap{color:var(--soft);font-size:.75rem;text-align:center;margin-top:8px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);text-decoration:none}
a.card{transition:border-color .18s,background .18s}
@media (hover:hover){a.card:hover{border-color:var(--soft);background:var(--hover)}}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
.latest{display:flex;gap:14px;align-items:center}
.latest img{width:192px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .t{font-size:.85rem;margin-top:10px;font-weight:500}
.sub{color:var(--soft);font-size:.75rem}
.sub strong{color:var(--ink);font-weight:600}
h1 .fade{color:var(--soft);opacity:.5}
.post{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.post a{color:var(--ink);text-decoration:none;font-size:.95rem}
.post a:hover{text-decoration:underline}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 18px}
.bar div{height:100%;background:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;padding:10px}
.nbtile{color:inherit;text-decoration:none}
.tile-img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center;border-radius:6px;display:block;background:var(--line);border:0}
.tile-ph{display:flex;align-items:center;justify-content:center;color:var(--soft)}
.tile-big{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tico{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile-cat{display:flex;align-items:center;gap:6px;margin:12px 2px 4px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.tile-title{font-size:.95rem;font-weight:600;line-height:1.3;margin:0 2px}
.tile-note{font-size:.8rem;color:var(--soft);line-height:1.45;margin:4px 2px 0}
.tile-days{margin:auto 2px 0;padding-top:10px}
.linkrow{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px}
.arrow-link{color:var(--ink);text-decoration:none;font-size:.9rem;display:inline-flex;align-items:center;gap:5px}
.arrow-link:hover{text-decoration:underline}
.seg{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;margin:20px 0 6px}
.seg button{font:inherit;font-size:.82rem;background:none;border:0;border-radius:6px;padding:6px 16px;color:var(--soft);cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--ink);color:var(--bg)}
@media (hover:hover){.seg button:not(.on):hover{color:var(--ink)}}
@media (prefers-reduced-motion:reduce){.seg button{transition:none}}
.prose{max-width:660px;font-size:var(--reading-font-size);line-height:1.65}
.prose p{color:var(--ink);line-height:1.65}
.prose h3{font-size:1.05rem;font-weight:600;margin:32px 0 8px}
.prose strong{font-weight:600}
.lt{position:relative;--h:108px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lt-scroll{height:var(--h);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none}
.lt-scroll::-webkit-scrollbar{display:none}
.lt-scroll:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.lt-item{display:flex;gap:14px;align-items:center;height:var(--h);padding:12px 34px 12px 12px;scroll-snap-align:start;scroll-snap-stop:always;color:var(--ink);text-decoration:none;transition:background .18s}
@media (hover:hover){.lt-item:hover{background:var(--hover)}}
.lt-item img,.lt-ph{width:144px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none;background:var(--line);display:block}
.lt-ph{display:flex;align-items:center;justify-content:center;color:var(--soft)}
.lt-ph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lt-title{font-size:.9rem;font-weight:500;line-height:1.35}
.lt-dots{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.lt-dot{width:16px;height:16px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lt-dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.lt-dot.on::after{background:var(--ink);transform:scale(1.25)}
.lt-dot:focus-visible{outline:2px solid var(--ink);border-radius:50%}
@media (prefers-reduced-motion:no-preference){.lt-scroll{scroll-behavior:smooth}}
.video{position:relative;padding-top:56.25%;margin-bottom:16px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
footer{margin-top:auto;padding-top:26px;padding-bottom:44px;border-top:1px solid var(--line);font-size:.85rem;color:var(--soft)}
.subrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:26px}
.subrow input{flex:1 1 160px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit}
.subrow input::placeholder{color:var(--soft)}
.subrow button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;transition:background .18s,border-color .18s,color .18s}
@media (hover:hover){.subrow button:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}}
.subrow input:focus-visible,.subrow button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.subnote{flex-basis:100%;margin:0;font-size:.8rem}
.footrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 24px}
.where{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--on);animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.7;box-shadow:0 0 0 0 rgba(52,199,89,0)}50%{transform:scale(1.1);opacity:1;box-shadow:0 0 0 7px rgba(52,199,89,.16)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.dog g{display:none}
.dog .base,.dog[data-f="0"] .down,.dog[data-f="1"] .up1,.dog[data-f="2"] .up2{display:inline}
.dog{color:var(--ink);display:block;flex:none}
.socials a{color:var(--ink);text-decoration:none;margin-left:16px}
.socials a:first-child{margin-left:0}
@media (max-width:680px){nav{position:relative;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:16px 80px 16px 20px;gap:12px}nav .right{flex-wrap:wrap;gap:14px}body:not(.home) .wrap{padding-top:0}.wrap{margin-left:0;width:100%;padding:0 20px}.ico{display:none}.hero h1{font-size:2rem}.for-intro{font-size:1.2rem}.hero-where{position:static;transform:none;margin-top:16px}.hero-actions{position:static;transform:none;flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px;margin-top:32px}.switch{top:18px;right:16px}.lt-item img,.lt-ph{width:104px}}
@media (prefers-reduced-motion:reduce){.switch,.switch::after{transition:none}}

/* Cursor halo: desktop/fine pointers only */
@media (hover:hover) and (pointer:fine){
  html,body,a,button,[role="button"],[role="switch"],.for-bar span,.lt-dot{cursor:none!important}
  .cursor-halo{position:fixed;left:0;top:0;width:66px;height:66px;z-index:10000;pointer-events:none;opacity:0;transform:translate3d(-50%,-50%,0);transition:opacity .18s ease;will-change:left,top,transform;contain:layout paint style}
  .cursor-halo.show{opacity:1}
  .cursor-halo svg{width:100%;height:100%;display:block;overflow:visible}
  .cursor-halo text{font-family:Inter,system-ui,sans-serif;font-size:9.5px;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;fill:var(--soft);transition:fill .18s ease,filter .18s ease}
  .cursor-halo.click text{font-size:8.5px;letter-spacing:1.7px;fill:#111;filter:drop-shadow(0 0 2px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(0,0,0,.25))}
  :root[data-theme="dark"] .cursor-halo.click text{fill:#fff;filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(255,255,255,.45))}
  .cursor-halo-dot{fill:var(--soft);opacity:.85;transition:fill .18s ease,filter .18s ease}
  .cursor-halo.click .cursor-halo-dot{fill:#111;filter:drop-shadow(0 0 2px rgba(0,0,0,.45))}
  :root[data-theme="dark"] .cursor-halo.click .cursor-halo-dot{fill:#fff;filter:drop-shadow(0 0 2px rgba(255,255,255,.75))}
}
@media (hover:none),(pointer:coarse){.cursor-halo{display:none!important}}


/* Shared long-form reading typography: About and full blog posts */
:root{--reading-font-size:1.125rem}
/* About page only — aligned to the site's 760px inner content grid */
.about-page{width:100%;max-width:760px;margin:0 auto;padding-top:0}
.about-page h1{margin:8px 0 12px;font-size:2rem}
.about-copy{font-size:var(--reading-font-size);line-height:1.65;color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) 196px;column-gap:28px;align-items:start}
.about-copy p{color:var(--ink);margin:0 0 16px;text-transform:lowercase;grid-column:1}
.about-photo{grid-column:2;grid-row:1 / span 3;width:196px;margin:0}
.about-photo .photo{width:100%;aspect-ratio:3/4}
.about-photo .cap{margin-top:4px}
body.about-route main{padding-bottom:8px}
@media (min-width:681px) and (max-height:820px){
  .about-page h1{margin:2px 0 8px}
  .about-copy p{margin-bottom:14px}
  
}
@media (min-width:681px) and (max-height:720px){
  .about-copy p{margin-bottom:12px}
}
@media (max-width:680px){
  .about-page{padding-top:0}
  .about-copy{display:block}.about-photo{width:min(210px,65vw);margin:0 auto 18px}
  body.about-route main{padding-bottom:24px}
}


/* Work section sticker headings */
.work-section-head{text-align:center;margin:18px 0 0}
.work-sticker-wrap{height:250px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;overflow:visible}
.work-sticker{display:block;height:250px;width:auto;max-width:100%;object-fit:contain}
.work-section-head h1{margin:0 0 12px}
.work-section-head p{margin:0;font-style:italic;font-family:Georgia,'Times New Roman',serif;font-weight:400}
@media (max-width:680px){.work-sticker-wrap{height:190px;margin-bottom:14px}.work-sticker{height:190px}}

/* Work post preview grid */
.work-post-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px;margin-top:38px}
.work-post-card{display:block;color:var(--ink);text-decoration:none;min-width:0}
.work-post-thumb{width:100%;aspect-ratio:4/5;display:block;object-fit:cover;border-radius:8px;background:var(--card);border:1px solid var(--line);transition:transform .16s ease,border-color .18s ease,background .18s ease}
.work-post-title{font-size:.95rem;font-weight:500;line-height:1.35;margin-top:10px}
.work-post-date{font-size:.75rem;color:var(--soft);margin-top:3px}
@media (hover:hover){.work-post-card:hover .work-post-thumb{transform:translateY(-2px);border-color:var(--soft);background:var(--hover)}}
@media (prefers-reduced-motion:reduce){.work-post-thumb{transition:none}.work-post-card:hover .work-post-thumb{transform:none}}
@media (max-width:680px){.work-post-grid{grid-template-columns:1fr;gap:26px;margin-top:30px}}
@media (min-width:681px) and (max-width:900px){.work-post-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Individual Work article */
.work-article{position:relative}
.work-article .prose{margin:0 auto;font-size:16px}
.work-article .prose h1{margin-bottom:8px}
.work-article .article-date{color:var(--soft);font-size:.8rem;margin-bottom:28px}
.work-article .chapter{scroll-margin-top:110px}
.work-article .chapter h3{font-size:1.05rem;font-weight:600;margin:34px 0 10px}
.chapter-rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:220px;color:var(--soft);z-index:80}
.chapter-rail-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase}
.chapter-rail-head button,.chapter-link{font:inherit;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chapter-rail-head button{color:var(--soft);letter-spacing:inherit;text-transform:inherit}
.chapter-rail-list{position:relative;display:flex;flex-direction:column;gap:15px}
.chapter-rail-list::before{display:none}.chapter-link:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:7px;height:calc(100% + 15px);width:1px;background:var(--soft);opacity:.55;z-index:0}
.chapter-link{position:relative;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start;color:var(--soft);font-size:.82rem;line-height:1.35;width:100%}
.chapter-dot{width:10px;height:10px;border:1.5px solid var(--soft);border-radius:50%;background:var(--bg);margin-top:2px;z-index:1;transition:background .18s,border-color .18s,box-shadow .18s}
.chapter-link.on{color:#111;font-weight:500;text-shadow:0 0 2px rgba(0,0,0,.32),0 0 8px rgba(0,0,0,.18)}
.chapter-link.on .chapter-dot{background:#111;border-color:#111;box-shadow:0 0 3px rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.24)}
:root[data-theme="dark"] .chapter-link.on{color:#fff;text-shadow:0 0 2px rgba(255,255,255,.75),0 0 8px rgba(255,255,255,.35)}
:root[data-theme="dark"] .chapter-link.on .chapter-dot{background:#fff;border-color:#fff;box-shadow:0 0 3px rgba(255,255,255,.75),0 0 8px rgba(255,255,255,.38)}
.chapter-words{opacity:.8;font-weight:400}
@media (hover:hover){.chapter-link:hover,.chapter-rail-head button:hover{color:var(--ink)}}
@media (max-width:1050px){.chapter-rail{display:none}}


.work-article .article-figure{margin:28px 0 8px}
.work-article .article-figure img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.work-article .article-source{font-size:.78rem;color:var(--soft);margin-top:6px}
.work-article .article-list{padding-left:20px;margin:0 0 16px}
.work-article .article-list li{margin-bottom:8px}


.work-article .prose a{color:var(--soft);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
@media (hover:hover){.work-article .prose a:hover{color:var(--ink)}}

.article-table-wrap{overflow-x:auto;margin:20px 0 18px}
.article-table{width:100%;border-collapse:collapse;font-size:.88rem}
.article-table th,.article-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.article-table th{font-weight:600;color:var(--ink)}
.article-table td{color:var(--soft)}


.article-subhead{font-size:.95rem;font-weight:600;margin:24px 0 10px}

/* Clearline article — reference-inspired screenshot/text rows */
.work-article.clearline-article .prose{line-height:1.62}
.work-article.clearline-article .chapter{display:block}
.work-article.clearline-article .chapter p{margin:0 0 16px}
.work-article.clearline-article .clearline-feature-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:center;margin:22px 0 26px;clear:both}
.work-article.clearline-article .clearline-feature-row .article-figure{float:none;width:190px;max-width:none;height:176px;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.work-article.clearline-article .clearline-feature-row .article-figure img{width:100%;height:100%;max-height:none;object-fit:cover;object-position:50% 22%;border:0;border-radius:0}
.work-article.clearline-article .clearline-feature-copy p:last-child{margin-bottom:0}
.work-article.clearline-article .clearline-feature-copy .article-subhead{margin:0 0 8px}
.work-article.clearline-article .clearline-feature-row:nth-of-type(even){grid-template-columns:minmax(0,1fr) 190px}
.work-article.clearline-article .clearline-feature-row:nth-of-type(even) .article-figure{grid-column:2}
.work-article.clearline-article .clearline-feature-row:nth-of-type(even) .clearline-feature-copy{grid-column:1;grid-row:1}
.work-article.clearline-article .clearline-wide-figure{width:min(100%,520px);margin:22px auto 26px}
.work-article.clearline-article .clearline-wide-figure .article-figure{float:none;width:100%;max-width:none;margin:0}
.work-article.clearline-article .clearline-wide-figure .article-figure img{width:100%;height:auto;max-height:280px;object-fit:cover;object-position:center;border-radius:8px}
@media (max-width:680px){
 .work-article.clearline-article .clearline-feature-row{grid-template-columns:1fr;gap:12px;margin:20px 0 24px}
 .work-article.clearline-article .clearline-feature-row .article-figure{width:min(240px,72vw);height:190px;margin:0 auto}
 .work-article.clearline-article .clearline-feature-copy{text-align:left}
}

    body: "I have been a long-time subscriber of **Reysu (Eric Su)** on YouTube. His approach to documenting his life and work eventually made me want to build a website of my own.\n\nAt the time of writing this, my website is a near-exact imitation of his, and I intend to keep it that way for the foreseeable future. I could spend weeks designing my own website, but honestly, that feels like a side-quest. Besides, the website itself isn't really the point. I want to turn it into a **record of how I figure things out.**\n\n## A Personal Laboratory\n\nThere are countless things I want to change about the way I live: how I exercise, how I organize my time, what I eat, and what I pay attention to.\n\nI try things all the time. The problem is, I rarely keep track of them.\n\nWe all start a new habits, try some productivity system we found online, change the way we work for a few weeks, and eventually move on. A few months later, we remember that we tried *something*, but not why we tried it, what happened, or why we stopped.\n\nI want this website to keep that record. When I try something new, I want to be able to write down what it is, where I found it, why I'm trying it, what happened, and whether I ended up keeping it. Some things will work. Some won't. That's part of the experiment.\n\n## Learning From My Own History\n\nI also want to be able to look back. It's surprisingly easy to forget how different your life was a year ago. You remember where you are now, but not always how you got there.\n\nWriting things down gives me a way to see that. I can look back at what I tried, what I abandoned, what stuck, and what I eventually came back to. Hopefully, that means I can learn from previous versions of myself instead of repeatedly starting from zero.\n\n## From Imitation to Adaptation\n\nI'm also interested in what happens between copying something and making it your own.\n\n**Imitation → Emulation → Adaptation → Innovation.**\n\nI can copy something, figure out why it works, change what doesn't fit, and eventually arrive at something that works for me.\n\nThat's the process I want this website to document.\n\n## What This Website Is For\n\nSo this isn't meant to be a collection of definitive advice. It's a record of my experiments. And progress rarely looks like a straight line when you're actually living through it. It's mostly trying things, changing your mind, keeping what works, and throwing away what doesn't. Maybe years from now I'll have a fairly coherent system for how I live and work. Or maybe I'll just have a very long list of things I tried and discarded.\n\nEither way, **I'll have the record.**" }

    const parts = [".hero h1", ".for-bar", ".for-intro", ".more-about"].map(q => hero.querySelector(q)).filter(Boolean).map(e => e.getBoundingClientRect());
    const x0 = Math.min(...parts.map(r => r.left)) - PAD, y0 = Math.min(...parts.map(r => r.top)) - PAD;
    const x1 = Math.max(...parts.map(r => r.right)) + PAD, y1 = Math.max(...parts.map(r => r.bottom)) + PAD;
    L = x0 + scrollX; T = y0 + scrollY; const nw = x1 - x0, nh = y1 - y0;
    Object.assign(cv.style, { left: L + "px", top: T + "px", width: nw + "px", height: nh + "px" });
    const dpr = window.devicePixelRatio || 1;
    cv.width = nw * dpr; cv.height = nh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (Math.abs(nw - W) > 40 || Math.abs(nh - H) > 40 || !dots.length) {

      for (let gx = 0; gx < W; gx += CELL) for (let gy = 0; gy < H; gy += CELL) {

        dots.push({ x: gx + Math.random() * CELL, y: gy + Math.random() * CELL, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: .8 + Math.random() * .6 });

  const onLeave = () => { inside = false; };

  window.addEventListener("pointermove", onMove); document.addEventListener("pointerleave", onLeave);

let forBarCleanup = null;
function initForBar() {
  if (forBarCleanup) { forBarCleanup(); forBarCleanup = null; }
  const bar = document.querySelector(".for-bar");
  if (!bar) return;
  const intro = document.querySelector(".for-intro");
  const tabs = [...bar.querySelectorAll("span[data-for]")];
  // Reserve the longest intro height so switching audiences never shifts the page.
  const fit = () => {
    const cur = intro.textContent; intro.style.minHeight = "0px"; let h = 0;
    FOR_CATEGORIES.forEach(c => { intro.textContent = c.text; h = Math.max(h, intro.offsetHeight); });
    intro.textContent = cur; intro.style.minHeight = h + "px";
  };
  const activate = i => {
    intro.textContent = FOR_CATEGORIES[i].text;
    tabs.forEach((tab,k) => tab.classList.toggle("active", k === i));
  };
  const handlers = tabs.map(tab => {
    const enter = () => activate(+tab.dataset.for);
    const leave = () => activate(forLocked);
    const click = () => { forLocked = +tab.dataset.for; activate(forLocked); };
    tab.addEventListener("mouseenter", enter);
    tab.addEventListener("mouseleave", leave);
    tab.addEventListener("click", click);
    return [tab, enter, leave, click];
  });
  const ro = new ResizeObserver(fit);
  ro.observe(bar);
  fit();
  forBarCleanup = () => {
    ro.disconnect();
    handlers.forEach(([tab,enter,leave,click]) => {
      tab.removeEventListener("mouseenter", enter);
      tab.removeEventListener("mouseleave", leave);
      tab.removeEventListener("click", click);
    });
  };
}

const FIRST_FIREPLACE_ARTICLE={"id":"why-i-started-a-personal-website","title":"Why I Started a Personal Website","date":"15 oct 2026","totalWords":1619,"chapters":[{"id":"chapter-1","title":"introduction","words":244,"paragraphs":["I've been meaning to start a personal website for six years. I know this because I recently found a journal entry from six years ago explaining, in surprising detail, why starting one would be a good idea. Apparently, I was quite convincing. Just not convincing enough to get myself to actually do it.","At the time, I didn't have the resources, or perhaps the resolve, to follow through. And as these things usually go, life got busy, other interests took over, and the idea quietly moved to the back of my mind. Reading that entry again was a little uncomfortable. Six years is a long time to keep putting off something you still believe is worth doing.","I've spent a good part of those years reading people like Paul Graham, Derek Sivers, Sam Altman, and Ryan Kulp. Their personal websites have been some of my favorite corners of the internet, and a big part of why I've wanted one of my own. They've shown me how much you can learn from someone who's willing to share their thinking openly, without needing a camera, a large audience, or much more than a place to write.","More recently, the youtuber Eric Reysu's writing and YouTube videos gave me the final push. Watching him consistently share what he's learning, building, and experimenting with made the whole thing feel much more approachable. So I finally decided to make one.","There are three reasons I think it's worth doing."],"formattedParagraphs":["I&#x27;ve been meaning to start a personal website for six years. I know this because I recently found a journal entry from six years ago explaining, in surprising detail, why starting one would be a good idea. Apparently, I was quite convincing. Just not convincing enough to get myself to actually do it.","At the time, I didn&#x27;t have the resources, or perhaps the resolve, to follow through. And as these things usually go, life got busy, other interests took over, and the idea quietly moved to the back of my mind. Reading that entry again was a little uncomfortable. Six years is a long time to keep putting off something you still believe is worth doing.","I&#x27;ve spent a good part of those years reading people like <strong>Paul Graham</strong>, <strong>Derek Sivers</strong>, <strong>Sam Altman</strong>, and <strong>Ryan Kulp</strong>. Their personal websites have been some of my favorite corners of the internet, and a big part of why I&#x27;ve wanted one of my own. They&#x27;ve shown me how much you can learn from someone who&#x27;s willing to share their thinking openly, without needing a camera, a large audience, or much more than a place to write.","More recently, the youtuber <strong>Eric Reysu&#x27;s</strong> writing and YouTube videos gave me the final push. Watching him consistently share what he&#x27;s learning, building, and experimenting with made the whole thing feel much more approachable. So I finally decided to make one.","There are three reasons I think it&#x27;s worth doing."]},{"id":"chapter-2","title":"increasing the surface area of luck","words":421,"paragraphs":["I've always liked the idea of increasing the surface area of luck. A lot of good things in life happen because you happen to meet the right person, come across the right idea, or find yourself in the right place at the right time. You can't plan most of these things, but you can make it easier for them to happen.","A few decades ago, if you had an idea worth sharing, your audience was largely limited to the people around you. Reaching strangers meant getting published, finding an audience through an institution, or paying for advertising. None of those options was particularly accessible. Today, you can write something from your bedroom, put it on a website, and someone on the other side of the world might find it years later. It's easy to take that for granted now, but I think it's one of the more extraordinary opportunities the internet has given us.","Of course, putting something online doesn't mean people will read it. Most things we publish will probably go unnoticed. But the possibility exists, and the cost of trying is almost nothing.","YouTube offers similar opportunities, but making videos comes with its own demands. You need to be comfortable on camera, record, edit, and think about how everything looks and sounds. I admire people who do it well, but writing feels like a much easier place for me to start.","I've personally benefited from strangers making that choice. When I started learning Japanese, I came across a blog called All Japanese All the Time, written by someone who went by Khatzumoto. He had taught himself Japanese through an unusually intensive approach to immersion and decided to share what he'd learned. Some of his ideas changed how I approached language learning. I had never met him, and he had no idea I existed. Yet something he wrote helped a stranger years later.","Another example I love is Tim Urban's Wait But Why. Tim writes long, thoughtful explanations of subjects he wants to understand, often accompanied by wonderfully simple drawings. His curiosity eventually led to an unexpected invitation from Elon Musk to learn about Tesla and SpaceX firsthand.","That's an extraordinary outcome, and certainly not one I'm expecting. But it illustrates something interesting: writing about what genuinely interests you can lead to opportunities you couldn't have anticipated. Maybe something I write will help someone. Maybe it'll introduce me to a future friend, colleague, or mentor. Maybe nothing unusual will happen at all. I'd still rather have those possibilities than not."],"formattedParagraphs":["I&#x27;ve always liked the idea of increasing the <em>surface area of luck</em>. A lot of good things in life happen because you happen to meet the right person, come across the right idea, or find yourself in the right place at the right time. You can&#x27;t plan most of these things, but you can make it easier for them to happen.","A few decades ago, if you had an idea worth sharing, your audience was largely limited to the people around you. Reaching strangers meant getting published, finding an audience through an institution, or paying for advertising. None of those options was particularly accessible. Today, you can write something from your bedroom, put it on a website, and someone on the other side of the world might find it years later. It&#x27;s easy to take that for granted now, but I think it&#x27;s one of the more extraordinary opportunities the internet has given us.","Of course, putting something online doesn&#x27;t mean people will read it. Most things we publish will probably go unnoticed. But the possibility exists, and the cost of trying is almost nothing.","YouTube offers similar opportunities, but making videos comes with its own demands. You need to be comfortable on camera, record, edit, and think about how everything looks and sounds. I admire people who do it well, but writing feels like a much easier place for me to start.","I&#x27;ve personally benefited from strangers making that choice. When I started learning Japanese, I came across a blog called <strong>All Japanese All the Time</strong>, written by someone who went by <strong>Khatzumoto</strong>. He had taught himself Japanese through an unusually intensive approach to immersion and decided to share what he&#x27;d learned. Some of his ideas changed how I approached language learning. I had never met him, and he had no idea I existed. Yet something he wrote helped a stranger years later.","Another example I love is <strong>Tim Urban&#x27;s</strong> <strong>Wait But Why</strong>. Tim writes long, thoughtful explanations of subjects he wants to understand, often accompanied by wonderfully simple drawings. His curiosity eventually led to an unexpected invitation from <strong>Elon Musk</strong> to learn about Tesla and SpaceX firsthand.","That&#x27;s an extraordinary outcome, and certainly not one I&#x27;m expecting. But it illustrates something interesting: writing about what genuinely interests you can lead to opportunities you couldn&#x27;t have anticipated. Maybe something I write will help someone. Maybe it&#x27;ll introduce me to a future friend, colleague, or mentor. Maybe nothing unusual will happen at all. I&#x27;d still rather have those possibilities than not."]},{"id":"chapter-3","title":"a modern-day business card","words":447,"paragraphs":["The second reason is a little more practical. I think a personal website is a modern-day business card, or perhaps a more complete version of a résumé.","A résumé tells people where you've studied, where you've worked, and what you've accomplished. It's useful, but it leaves out most of the things that make someone interesting. It doesn't tell you what they spend their weekends learning, which problems they find fascinating, what they've tried and failed at, or how their interests have changed over time. A personal website can.","People sometimes call this building a personal brand, although I prefer to think of it as giving people a more complete picture of who I am and what interests me.","I've decided to call this little corner of the internet Etharic. There's something satisfying about giving what you do a name of its own, separate from your own. It makes the whole thing feel like something you're building rather than simply a collection of things you've done. Even small bits of progress, whether on a project or in my personal life, feel a little more meaningful when they become part of something that can grow over time. I suppose there's a quiet sense of ownership in that, too.","I want this to be a place where I can share ideas, keep track of my year, and write detailed guides to projects I've built or adopted. Some will be technical. Others might have to do with finance, learning, or something completely unrelated that happens to catch my attention. Not everything will be particularly impressive, and that's fine.","The value, at least to me, is in having these things together, presented in a way that feels like my own. A record of what I've spent my time thinking about and doing.","I've also come to appreciate how much of life is shaped by conversations. I've always enjoyed striking up conversations with people, including those whose work has little to do with mine. Over the years, I've met people working in finance, technology, law, and entrepreneurship, sometimes in the most ordinary circumstances.","Looking back, I can trace quite a few changes in my life to conversations with people who were generous enough to share their experiences with me. Some introduced me to new interests, while others changed how I approached things I already cared about. I owe quite a lot to those conversations.","In a way, I see this website as an extension of them. Instead of waiting to meet someone before exchanging ideas, I can put a few of mine here. Someone with similar interests might stumble across them. And if that leads to an interesting conversation someday, all the better."],"formattedParagraphs":["The second reason is a little more practical. I think a personal website is a modern-day business card, or perhaps a more complete version of a résumé.","A résumé tells people where you&#x27;ve studied, where you&#x27;ve worked, and what you&#x27;ve accomplished. It&#x27;s useful, but it leaves out most of the things that make someone interesting. It doesn&#x27;t tell you what they spend their weekends learning, which problems they find fascinating, what they&#x27;ve tried and failed at, or how their interests have changed over time. A personal website can.","People sometimes call this building a personal brand, although I prefer to think of it as giving people a more complete picture of who I am and what interests me.","I&#x27;ve decided to call this little corner of the internet <strong>Etharic</strong>. There&#x27;s something satisfying about giving what you do a name of its own, separate from your own. It makes the whole thing feel like something you&#x27;re building rather than simply a collection of things you&#x27;ve done. Even small bits of progress, whether on a project or in my personal life, feel a little more meaningful when they become part of something that can grow over time. I suppose there&#x27;s a quiet sense of ownership in that, too.","I want this to be a place where I can share ideas, keep track of my year, and write detailed guides to projects I&#x27;ve built or adopted. Some will be technical. Others might have to do with finance, learning, or something completely unrelated that happens to catch my attention. Not everything will be particularly impressive, and that&#x27;s fine.","The value, at least to me, is in having these things together, presented in a way that feels like my own. A record of what I&#x27;ve spent my time thinking about and doing.","I&#x27;ve also come to appreciate how much of life is shaped by conversations. I&#x27;ve always enjoyed striking up conversations with people, including those whose work has little to do with mine. Over the years, I&#x27;ve met people working in finance, technology, law, and entrepreneurship, sometimes in the most ordinary circumstances.","Looking back, I can trace quite a few changes in my life to conversations with people who were generous enough to share their experiences with me. Some introduced me to new interests, while others changed how I approached things I already cared about. I owe quite a lot to those conversations.","In a way, I see this website as an extension of them. Instead of waiting to meet someone before exchanging ideas, I can put a few of mine here. Someone with similar interests might stumble across them. And if that leads to an interesting conversation someday, all the better."]},{"id":"chapter-4","title":"the satisfaction of making something useful","words":386,"paragraphs":["The final reason is probably the most important to me. I spend a lot of time consuming things: books, articles, videos, podcasts, and conversations. There's so much good material available that you could spend your entire life learning from other people and never run out.","But I've spent years learning from things other people have made. I'd like to spend a little more time on the other side of that exchange, contributing something of my own rather than always being the one consuming it.","Writing is one way of doing that. It forces me to take ideas that seem perfectly clear in my head and find out whether I actually understand them. Quite often, I suspect I'll discover that I don't. That's useful in itself.","There's also a different kind of satisfaction in making something that helps another person.","One of the activities I find most meaningful is volunteering with children in institutional care. Much of what I do involves helping them with learning and education, whether that's explaining a difficult concept, working through an exercise, or simply finding an approach that makes something easier to understand.","The children I work with are capable and curious. What they haven't always had are the same circumstances and opportunities as others. I don't think of my role as doing anything extraordinary. Often, it's just about being present, patient, and useful.","What stays with me are the small moments when something finally makes sense, or when a conversation helps someone see a problem differently. Those moments are surprisingly fulfilling. I'd like this website to carry a little of that same spirit.","Obviously, writing something online is not the same as sitting beside someone and helping them work through a problem. But if I learn something useful, find a better way of doing something, or spend weeks figuring out a project, perhaps writing it down can save somebody else a little time.","It doesn't need to reach thousands of people to be worthwhile. If one person finds an explanation helpful, avoids a mistake I made, or discovers something they hadn't considered before, that's already a good reason to have written it. And even if nobody reads a particular post, I'll have a record of what I was thinking and learning at that point in my life. That seems worthwhile, too."],"formattedParagraphs":["The final reason is probably the most important to me. I spend a lot of time consuming things: books, articles, videos, podcasts, and conversations. There&#x27;s so much good material available that you could spend your entire life learning from other people and never run out.","But I&#x27;ve spent years learning from things other people have made. I&#x27;d like to spend a little more time on the other side of that exchange, contributing something of my own rather than always being the one consuming it.","Writing is one way of doing that. It forces me to take ideas that seem perfectly clear in my head and find out whether I actually understand them. Quite often, I suspect I&#x27;ll discover that I don&#x27;t. That&#x27;s useful in itself.","There&#x27;s also a different kind of satisfaction in making something that helps another person.","One of the activities I find most meaningful is volunteering with children in institutional care. Much of what I do involves helping them with learning and education, whether that&#x27;s explaining a difficult concept, working through an exercise, or simply finding an approach that makes something easier to understand.","The children I work with are capable and curious. What they haven&#x27;t always had are the same circumstances and opportunities as others. I don&#x27;t think of my role as doing anything extraordinary. Often, it&#x27;s just about being present, patient, and useful.","What stays with me are the small moments when something finally makes sense, or when a conversation helps someone see a problem differently. Those moments are surprisingly fulfilling. I&#x27;d like this website to carry a little of that same spirit.","Obviously, writing something online is not the same as sitting beside someone and helping them work through a problem. But if I learn something useful, find a better way of doing something, or spend weeks figuring out a project, perhaps writing it down can save somebody else a little time.","It doesn&#x27;t need to reach thousands of people to be worthwhile. If one person finds an explanation helpful, avoids a mistake I made, or discovers something they hadn&#x27;t considered before, that&#x27;s already a good reason to have written it. And even if nobody reads a particular post, I&#x27;ll have a record of what I was thinking and learning at that point in my life. That seems worthwhile, too."]},{"id":"chapter-5","title":"a place to begin","words":121,"paragraphs":["I don't have a grand plan for this website. For now, I want to write regularly, document the things I'm working on, and leave behind useful notes for whoever might find them. Some posts will be carefully researched guides. Others will simply be thoughts I'm still trying to make sense of.","I expect my interests to change, and I hope the website changes with them. Six years ago, I wrote down a few reasons to start something like this. I'm glad I eventually came back to them.","If you're curious about any of the same things, I hope you'll enjoy reading along. And if something here makes even a small part of someone's life easier, I'll consider it time well spent."],"formattedParagraphs":["I don&#x27;t have a grand plan for this website. For now, I want to write regularly, document the things I&#x27;m working on, and leave behind useful notes for whoever might find them. Some posts will be carefully researched guides. Others will simply be thoughts I&#x27;m still trying to make sense of.","I expect my interests to change, and I hope the website changes with them. Six years ago, I wrote down a few reasons to start something like this. I&#x27;m glad I eventually came back to them.","If you&#x27;re curious about any of the same things, I hope you&#x27;ll enjoy reading along. And if something here makes even a small part of someone&#x27;s life easier, I&#x27;ll consider it time well spent."]}]};
const NETFLIX_WARNER_ARTICLE={"id":"netflix-warner-ma","title":"Netflix–Warner Bros.: The Value of Certainty in a Contested Acquisition","date":"9 dec 2025","totalWords":621,"chapters":[{"id":"netflix-warner-ma-introduction","title":"introduction","words":31,"elements":[{"type":"p","html":"<em>The $30 Paramount offer creates a credible challenge to Netflix&#x27;s signed agreement. The deciding variable is the value of the assets WBD shareholders retain, adjusted for financing, timing and completion risk.</em>"}]},{"id":"netflix-warner-ma-chapter-1","title":"Transaction view","words":121,"elements":[{"type":"p","html":"Netflix&#x27;s agreement to acquire Warner Bros.&#x27; studios and streaming assets remains a viable transaction despite Paramount Skydance&#x27;s competing $30-per-share tender offer. However, the existing agreement should not be assigned a decisive advantage merely because it was signed first."},{"type":"p","html":"The competing proposals acquire different assets. Netflix&#x27;s $27.75-per-share consideration excludes Discovery Global, which WBD shareholders would retain following the planned separation. Paramount proposes to acquire the entire company for cash. Comparing the headline prices without valuing the retained business would produce a misleading conclusion."},{"type":"p","html":"Our assessment is that Netflix retains a plausible advantage on risk-adjusted value, but Paramount&#x27;s financing commitments and willingness to pursue shareholders directly make the outcome less certain than the existing merger agreement suggests."}]},{"id":"netflix-warner-ma-chapter-2","title":"Transaction economics","words":238,"elements":[{"type":"p","html":"<strong>Exhibit 1. Consideration comparison</strong>"},{"type":"table","headers":["Component","Netflix","Paramount"],"rows":[["Cash consideration","$23.25","$30.00"],["Stock consideration at announcement","~$4.50","—"],["Headline consideration","$27.75","$30.00"],["Retained Discovery Global equity","Yes","No"],["Assets acquired","Studios and streaming","Entire WBD"],["Transaction structure","Signed merger agreement","Tender offer"]]},{"type":"p","html":"<em>Source: <a href=\"https://ir.netflix.net/investor-news-and-events/financial-releases/press-release-details/2025/NETFLIX-TO-ACQUIRE-WARNER-BROS--FOLLOWING-THE-SEPARATION-OF-DISCOVERY-GLOBAL-FOR-A-TOTAL-ENTERPRISE-VALUE-OF-82-7-BILLION-Equity-Value-of-72-0-Billion/default.aspx\" target=\"_blank\" rel=\"noopener\">Netflix–WBD transaction announcement</a> and <a href=\"https://www.investing.com/news/stock-market-news/paramount-makes-1084-billion-hostile-bid-for-warner-bros-discovery-4396432\" target=\"_blank\" rel=\"noopener\">Reuters reporting on Paramount&#x27;s offer</a>. Netflix stock consideration is subject to its contractual collar.</em>"},{"type":"p","html":"Discovery Global must be worth more than approximately <strong>$2.25 per existing WBD share</strong>, assuming Netflix&#x27;s $27.75 consideration remains intact, for its aggregate nominal package to exceed Paramount&#x27;s $30 offer. That threshold is not an estimate of intrinsic value; it identifies the valuation question shareholders must resolve."},{"type":"p","html":"<strong>Exhibit 2. Retained-equity sensitivity</strong>"},{"type":"table","headers":["Discovery Global value/share","Netflix total value","Difference vs Paramount"],"rows":[["$0.50","$28.25","−$1.75"],["$1.50","$29.25","−$0.75"],["$2.50","$30.25","+$0.25"],["$3.50","$31.25","+$1.25"]]},{"type":"p","html":"<em>Illustrative values before timing, tax, execution risk and stock-collar adjustments. Not forecasts of Discovery Global&#x27;s fair value.</em>"},{"type":"p","html":"The more difficult issue is whether the separated networks business can sustain the debt allocated to it. EBITDA alone is inadequate without assessing cash interest, declining linear television revenue, restructuring costs and maturities. Paramount&#x27;s all-cash proposal removes stock-market exposure from its consideration but not financing or regulatory risk. Its December 8 filing identifies financing commitments and equity backing, so it cannot be dismissed as merely indicative."}]},{"id":"netflix-warner-ma-chapter-3","title":"Why Netflix's industrial logic matters","words":108,"elements":[{"type":"p","html":"Netflix&#x27;s acquisition rationale combines distribution scale and content ownership. Management expects $2–3 billion in annual cost savings by the third year, but those savings should not be capitalized as though immediately available. At a 10% discount rate, a hypothetical $2.5 billion perpetual annual pre-tax saving has a headline present value of $25 billion <strong>if available immediately</strong>. This is not an acquisition valuation: taxes, implementation costs, delays and revenue dis-synergies would reduce its economic value."},{"type":"p","html":"The implication is that Netflix may have buyer-specific synergies unavailable to an independent owner. The same integration raises competition and execution questions, particularly where content ownership and distribution overlap."}]},{"id":"netflix-warner-ma-chapter-4","title":"Completion outlook","words":123,"elements":[{"type":"p","html":"The existing agreement provides Netflix with a defined structure, while Paramount&#x27;s proposal could become more attractive if financing and closing terms improve. Critical variables are Discovery Global&#x27;s capitalization and standalone value, changes to consideration, financing protections, termination provisions and regulatory milestones."},{"type":"p","html":"Our working view favors Netflix&#x27;s agreement remaining the principal completion route. The risk is not simply a higher competing price but a revised Paramount proposal that improves both consideration and perceived certainty."},{"type":"p","html":"<strong>Transaction conclusion:</strong> Netflix&#x27;s signed agreement has meaningful value, but its completion case depends on whether retained Discovery Global equity and execution advantages outweigh Paramount&#x27;s cash premium."},{"type":"p","html":"<em>Historical M&amp;A research reconstruction. Information cutoff: December 8, 2025. Written retrospectively, not originally published December 9, 2025. Independent analysis, not a fairness opinion.</em>"}]}]};
const CRUDE_OIL_ARTICLE={"id":"crude-oil-2026","title":"Crude Oil: A Supply Surplus With Limited Near-Term Price Support","date":"23 jan 2026","totalWords":657,"chapters":[{"id":"crude-oil-2026-introduction","title":"introduction","words":25,"elements":[{"type":"p","html":"<em>Inventory accumulation and production growth support a softer Brent outlook. The principal risk is that a concentrated disruption to deliverable supply overwhelms the global surplus.</em>"}]},{"id":"crude-oil-2026-chapter-1","title":"Sector view","words":90,"elements":[{"type":"p","html":"The global oil market enters 2026 with a substantial inventory buffer and projected production growth exceeding incremental consumption. These fundamentals support a cautious view on crude prices and upstream earnings. Our central scenario places Brent predominantly within <strong>$55–65/bbl in H2 2026</strong>, assuming no prolonged interruption to major export routes. This is an independent scenario, not an IEA forecast or a statistical confidence interval."},{"type":"p","html":"The distinction is between a well-supplied market and a market immune to disruption. The former is supported by available evidence; the latter is not."}]},{"id":"crude-oil-2026-chapter-2","title":"Physical balance and inventories","words":164,"elements":[{"type":"p","html":"The <a href=\"https://www.iea.org/reports/oil-market-report-january-2026\" target=\"_blank\" rel=\"noopener\">IEA January Oil Market Report</a> forecasts supply growth of 2.5 million barrels per day against demand growth of 0.93 million barrels per day. Observed inventories increased substantially in 2025, indicating that excess production was already entering storage."},{"type":"p","html":"<strong>Exhibit 1. Supply-side indicators</strong>"},{"type":"table","headers":["Indicator","January 2026 evidence"],"rows":[["Forecast 2026 supply growth","+2.50 mb/d"],["Forecast 2026 demand growth","+0.93 mb/d"],["Difference in annual growth","+1.57 mb/d"],["Observed 2025 stock accumulation","~470 million barrels"],["December North Sea Dated average","$62.64/bbl"]]},{"type":"p","html":"<em>Source: IEA January 21, 2026. Difference in growth rates is not the projected absolute surplus.</em>"},{"type":"p","html":"Incremental supply is likely to compete for buyers rather than meet an immediate shortage. Inventories can absorb temporary demand increases, reducing the need for rapid price appreciation. However, global stock totals conceal differences in location, crude quality and accessibility. Commercial stocks, strategic reserves and oil in transit are not interchangeable when a disruption occurs at a particular refinery or shipping route."}]},{"id":"crude-oil-2026-chapter-3","title":"Implications for upstream earnings","words":158,"elements":[{"type":"p","html":"For producers, the main transmission mechanism is realized prices and operating cash generation. Production may remain stable over shorter periods because existing wells can operate even when lower prices discourage new investment."},{"type":"p","html":"<strong>Exhibit 2. Illustrative upstream price sensitivity</strong>"},{"type":"p","html":"<em>Hypothetical producer: 250,000 barrels/day; US$ billion annually.</em>"},{"type":"table","headers":["Realized oil price","$50/bbl","$60/bbl","$70/bbl"],"rows":[["Gross revenue","4.56","5.48","6.39"],["Operating contribution at $30/bbl unit cost","1.83","2.74","3.65"]]},{"type":"p","html":"<em>Illustrative constant-volume scenario. Excludes royalties, taxes, hedging, transport differentials, corporate expenses and capital expenditure. Operating contribution is not free cash flow.</em>"},{"type":"p","html":"Every $10/bbl movement in realized price changes annual gross revenue by approximately $913 million for this production base. Low-cost operators may preserve investment capacity at prices that force higher-cost producers to reduce drilling, eventually limiting supply. The response is delayed because existing-well production depends on operating economics, not the full cost of developing replacement reserves."}]},{"id":"crude-oil-2026-chapter-4","title":"Scenarios and invalidation","words":129,"elements":[{"type":"p","html":"<strong>Exhibit 3. Brent scenario framework</strong>"},{"type":"table","headers":["Scenario","H2 2026 range","Economic condition"],"rows":[["Downside","$45–55","Larger stock builds; limited production restraint"],["Central","$55–65","Surplus persists; export routes remain operational"],["Upside","$70–90","Material supply restraint or regional disruption"]]},{"type":"p","html":"<em>Independent scenario ranges, not probability-weighted forecasts. A severe shock could exceed the illustrated upside range.</em>"},{"type":"p","html":"The central case is supported by production growth and accumulated inventories. The main counterargument is that the physical market can tighten rapidly when losses are geographically concentrated. A disruption affecting several million barrels per day of export capacity could exceed the projected incremental surplus. Tanker interruptions can also create shortages of deliverable crude without destroying equivalent production capacity."},{"type":"p","html":"The forecast requires reassessment if inventories begin declining persistently, physical crude differentials strengthen or export availability deteriorates."}]},{"id":"crude-oil-2026-chapter-5","title":"Sector conclusion","words":91,"elements":[{"type":"p","html":"January evidence supports a softer oil-price environment, with implications for upstream cash generation and high-cost investment. The weakness of the forecast is its reliance on continued access to major production and transport routes. Inventories cushion modest interruptions, but their effectiveness depends on location and deliverability."},{"type":"p","html":"<strong>Central expectation:</strong> Brent trades predominantly within $55–65 in H2 2026, conditional on the absence of a sustained major supply disruption."},{"type":"p","html":"<em>Historical energy-sector reconstruction. Information cutoff: January 22, 2026. Written retrospectively, not originally published January 23, 2026. Independent scenarios, not IEA price forecasts.</em>"}]}]};
const SPACEX_IPO_ARTICLE={"id":"spacex-ipo-2026","title":"SpaceX: Starlink's Cash-Generating Potential and the Limits of IPO Valuation","date":"22 may 2026","totalWords":602,"chapters":[{"id":"spacex-ipo-2026-introduction","title":"introduction","words":18,"elements":[{"type":"p","html":"<em>The connectivity business provides a measurable operating foundation, but the consolidated valuation reflects expectations extending beyond demonstrated earnings.</em>"}]},{"id":"spacex-ipo-2026-chapter-1","title":"Investment view","words":74,"elements":[{"type":"p","html":"SpaceX&#x27;s proposed public offering should attract substantial institutional demand, supported by Starlink&#x27;s commercial scale, launch capabilities and the limited availability of comparable listed assets. Our expectation is that the offering can support an equity valuation <strong>exceeding $1.5 trillion</strong>. This forecasts public-market demand, not intrinsic value."},{"type":"p","html":"SpaceX&#x27;s profitable connectivity operations coexist with capital-intensive activities whose economic returns remain uncertain. Treating the company as a pure satellite-broadband business would misrepresent the investment."}]},{"id":"spacex-ipo-2026-chapter-2","title":"Segment economics","words":180,"elements":[{"type":"p","html":"The May 2026 IPO disclosures provide a clearer basis for distinguishing the operating businesses. Based on <a href=\"https://www.investing.com/news/stock-market-news/bound-for-mars-elon-musks-spacex-unveils-filing-for-blockbuster-ipo-4702463\" target=\"_blank\" rel=\"noopener\">contemporary Reuters reporting on the filing</a>, connectivity generated approximately $3.26 billion of first-quarter revenue and $1.19 billion of segment operating profit."},{"type":"p","html":"<strong>Exhibit 1. Q1 2026 segment economics</strong>"},{"type":"p","html":"<em>US$ billion, rounded.</em>"},{"type":"table","headers":["Business","Revenue","Operating result"],"rows":[["Connectivity","3.26","+1.19"],["Space operations","0.62","Not separately established here"],["Artificial intelligence","0.82","−2.47"],["Consolidated","4.69","−1.94"]]},{"type":"p","html":"<em>Contemporary May 2026 IPO reporting. Rounded segment revenues need not sum precisely to the consolidated figure; operating results require corporate and consolidation adjustments. Reconcile to the original filing before external publication.</em>"},{"type":"p","html":"Connectivity&#x27;s approximately 36.5% segment operating margin is meaningful, but it is not a free-cash-flow margin. Satellites require replacement; network capacity, customer equipment and launch infrastructure require continuing investment. The advantage of vertically integrated launches depends on lifecycle cost and return on invested capital, not merely lower apparent deployment expense."},{"type":"p","html":"The question is whether incremental subscribers and network capacity generate attractive returns after accounting for replacement cycles and investment requirements."}]},{"id":"spacex-ipo-2026-chapter-3","title":"Valuation framework","words":125,"elements":[{"type":"p","html":"Using approximately $18.7 billion of FY2025 consolidated revenue, a $1.5 trillion equity valuation implies approximately 80× historical sales."},{"type":"p","html":"<strong>Exhibit 2. Equity valuation sensitivity</strong>"},{"type":"table","headers":["Equity valuation","Equity value / FY2025 sales"],"rows":[["$1.25tn","~67×"],["$1.50tn","~80×"],["$1.75tn","~94×"],["$2.00tn","~107×"]]},{"type":"p","html":"<em>Illustrative equity-value-to-sales ratios, not enterprise-value multiples or fair-value estimates.</em>"},{"type":"p","html":"These multiples cannot be justified by consolidated historical revenue alone. Investors must anticipate substantial growth, strong incremental margins or significant value from activities that have not established comparable earnings. A sum-of-the-parts valuation would distinguish mature connectivity cash flows from launch operations and higher-risk development activities. But reliable segment capex, corporate allocations and long-term reinvestment assumptions are needed before assigning a defensible intrinsic value."}]},{"id":"spacex-ipo-2026-chapter-4","title":"Capital allocation and governance","words":89,"elements":[{"type":"p","html":"The group reported substantial first-quarter capital expenditure, including investment associated with the AI business. This creates a potential divergence between operating value creation and consolidated cash generation: a profitable segment may finance expansion elsewhere, without that expenditure immediately earning attractive returns."},{"type":"p","html":"Investors should monitor capital expenditure by business, operating cash conversion, debt requirements and how connectivity profits are allocated. Founder control further limits minority shareholders&#x27; influence over capital allocation. Such control may support long-horizon projects, but it also increases the importance of evaluating governance and reinvestment discipline."}]},{"id":"spacex-ipo-2026-chapter-5","title":"IPO outlook","words":116,"elements":[{"type":"p","html":"We expect Starlink&#x27;s established commercial base, integrated launch infrastructure and scarcity value to support institutional demand for the offering. Risks include valuation sensitivity, capital intensity and uncertain returns from non-connectivity activities."},{"type":"p","html":"The forecast does not require near-term consolidated profitability. It assumes investors will capitalize future growth and strategic position at an exceptional valuation."},{"type":"p","html":"<strong>A successful IPO would establish willingness to pay for SpaceX&#x27;s future earnings potential, not that the offering valuation is fundamentally inexpensive or that subsequent shareholder returns will be attractive.</strong>"},{"type":"p","html":"<em>Historical IPO research reconstruction. Information cutoff: May 21, 2026. Written retrospectively, not originally published May 22, 2026. Contemporary segment figures should be reconciled to the primary filing before publication. Not investment advice.</em>"}]}]};
const HABITKIT_ARTICLE={"id":"habitkit-small-habits-big-changes","title":"HabitKit: Making Self-Improvement Feel Like a GitHub Contribution Graph","date":"6 aug 2026","totalWords":497,"chapters":[{"id":"habitkit-introduction","title":"introduction","words":72,"elements":[{"type":"p","html":"<em>A little habit tracker that makes showing up surprisingly satisfying.</em>"},{"type":"p","html":"We all have that imaginary version of ourselves who reads every day, works out regularly, drinks enough water, and somehow has their life together."},{"type":"p","html":"The problem? Actually becoming that person."},{"type":"p","html":"I’ve tried notebooks, productivity systems, and the classic “I’ll definitely remember.” Spoiler: I did not remember."},{"type":"p","html":"Then I started using HabitKit, an iOS habit tracker that makes showing up feel surprisingly rewarding."}]},{"id":"habitkit-chapter-1","title":"The GitHub Graph, but for Your Life","words":75,"elements":[{"type":"p","html":"You know those tiny green squares on a developer’s GitHub profile? HabitKit brings that same contribution-grid feeling to everyday habits."},{"type":"p","html":"Complete a habit and a square lights up. Miss a day and it stays empty. That’s the magic."},{"type":"p","html":"Suddenly, reading ten pages or going for a walk becomes another little piece of evidence that you’re actually doing the thing. A streak is nice, but the bigger win is seeing the pattern grow over time."},{"type":"image","alt":"Illustrative contribution-style habit grid","src":"habitkit-habit-grid.svg"}]},{"id":"habitkit-chapter-2","title":"Small Wins, Big Changes","words":86,"elements":[{"type":"p","html":"The idea reminds me of the philosophy popularized by Atomic Habits: lasting change is less about dramatic transformations and more about small actions repeated consistently."},{"type":"p","html":"You don’t become a reader by finishing one enormous book in a weekend. You become one by reading a little, over and over."},{"type":"p","html":"HabitKit makes that repetition visible. Instead of staring at a distant goal like “get fit,” you focus on today’s manageable action. The app won’t do the push-ups for you, but it makes the effort easier to notice."},{"type":"image","alt":"Illustration of accumulated habit check-ins","src":"habitkit-consistency.svg"}]},{"id":"habitkit-chapter-3","title":"Breaking Bad (Habits, Obviously)","words":68,"elements":[{"type":"p","html":"Building good habits is one challenge. Breaking bad ones is another."},{"type":"p","html":"The same daily check-in can work for days when you avoid something you’re trying to quit. That simple reversal matters: progress isn’t always about adding more to your life. Sometimes it’s about doing less of what doesn’t help."},{"type":"p","html":"And a missed day isn’t a verdict on your character. It’s one empty square. Tomorrow is another chance."}]},{"id":"habitkit-chapter-4","title":"An App That Doesn’t Demand Your Attention","words":57,"elements":[{"type":"p","html":"My favorite thing about HabitKit might be how little time I need to spend in it. Open it, mark the habit, move on."},{"type":"p","html":"The visual history is the reward, not an excuse to spend twenty minutes managing a productivity dashboard. That’s exactly how a habit tracker should behave: it supports real life instead of competing with it."}]},{"id":"habitkit-chapter-5","title":"Pay Once. Build Habits Forever.","words":74,"elements":[{"type":"p","html":"Can we talk about subscriptions for a second? Somehow even the smallest utilities want to become another monthly bill."},{"type":"p","html":"HabitKit’s lifetime purchase option is refreshing. There may be subscription choices too, but I love being able to pay once for a tool I intend to use for years."},{"type":"p","html":"Of course, a lifetime purchase doesn’t guarantee updates forever. Still, for a simple, long-term personal tool, not having another recurring charge feels like a win."}]},{"id":"habitkit-chapter-6","title":"The Bigger Picture","words":65,"elements":[{"type":"p","html":"HabitKit won’t change your life overnight. It won’t magically make you a morning person or someone who enjoys broccoli."},{"type":"p","html":"What it can do is make consistency visible. After a few months, those little squares tell a surprisingly personal story about the person you’re becoming."},{"type":"p","html":"You don’t need a perfect day. You just need enough ordinary days where you show up."},{"type":"p","html":"One square at a time."}]}]};
const CLEARLINE_ARTICLE={"id":"clearline-why-i-built-it","title":"Clearline: Why I Built My Own Productivity System","date":"28 sep 2026","totalWords":487,"chapters":[{"id":"clearline-introduction","title":"introduction","words":13,"elements":[{"type":"p","html":"<em>Inspired by Things 3. Guided by Getting Things Done. Built through vibe coding.</em>"}]},{"id":"clearline-chapter-1","title":"Why I built it","words":114,"elements":[{"type":"p","html":"I built <strong>Clearline</strong> to make everyday life more intentional: one place to capture ideas, clarify commitments, and focus on what matters. I admired the calm, considered design of <strong>Things 3</strong>, but its Apple-only ecosystem did not fit my life. My iPhone is my main device; I also use Windows and want access from a Mac or other modern devices."},{"type":"p","html":"Instead of changing my workflow to fit a product, I built a product around my workflow. <strong>Clearline is genuinely a vibe-coded project</strong>: through AI-assisted coding, testing, and iteration, I created personal software without commissioning a development team. The ability to shape my own tools is itself a meaningful addition to my life."}]},{"id":"clearline-chapter-2","title":"The principles","words":69,"elements":[{"type":"p","html":"Clearline draws on <strong>David Allen&#x27;s <em>Getting Things Done</em> (GTD)</strong>: the mind is better used for thinking than for repeatedly remembering unfinished obligations. Its five stages are <strong>capture, clarify, organize, reflect, and engage</strong>."},{"type":"p","html":"I want a trusted external brain—not an ever-growing list that creates more stress. Capture thoughts quickly, turn vague ideas into next actions, place them in the right context, review regularly, and then do the work."}]},{"id":"clearline-chapter-3","title":"A tour of the app","words":106,"elements":[{"type":"subhead","html":"Inbox — Capture"},{"type":"p","html":"I put ideas, errands, reminders, and obligations here the moment they occur. Organization can wait; forgetting should not."},{"type":"image","alt":"Illustration of inbox view","src":"clearline-inbox.webp"},{"type":"subhead","html":"Today — Focus"},{"type":"p","html":"Today is where I choose a realistic set of priorities instead of staring at everything I might someday do."},{"type":"image","alt":"Illustration of today view","src":"clearline-today.webp"},{"type":"subhead","html":"Upcoming — Plan"},{"type":"p","html":"Future commitments stay visible without competing with what needs attention right now."},{"type":"image","alt":"Illustration of upcoming view","src":"clearline-upcoming.webp"},{"type":"subhead","html":"Anytime and Someday — Decide what can wait"},{"type":"p","html":"Anytime is for actionable work without a fixed date. Someday is for possibilities I want to preserve without making them immediate obligations."},{"type":"image","alt":"Illustration of anytime someday view","src":"clearline-anytime-someday.webp"},{"type":"subhead","html":"Projects and Areas — Organize"},{"type":"p","html":"Projects turn larger outcomes into steps. Areas group ongoing responsibilities, such as work, home, finances, or personal development."},{"type":"image","alt":"Illustration of projects areas view","src":"clearline-projects-areas.webp"},{"type":"subhead","html":"Logbook — Reflect"},{"type":"p","html":"Completed work deserves to be visible. Looking back helps me recognize progress rather than only unfinished tasks."},{"type":"image","alt":"Illustration of logbook view","src":"clearline-logbook.webp"}]},{"id":"clearline-chapter-4","title":"One system across devices","words":102,"elements":[{"type":"p","html":"Clearline is accessible on the web at <strong><a href=\"https://tasks.etharic.com/\" target=\"_blank\" rel=\"noopener\">tasks.etharic.com</a></strong>."},{"type":"p","html":"Clearline is accessible on the web at <strong><a href=\"https://tasks.etharic.com/\" target=\"_blank\" rel=\"noopener\">tasks.etharic.com</a></strong>."},{"type":"p","html":"Clearline is accessible on the web at <strong><a href=\"https://tasks.etharic.com/\" target=\"_blank\" rel=\"noopener\">tasks.etharic.com</a></strong>."},{"type":"p","html":"Clearline was designed <strong>iPhone-first, not iPhone-only</strong>. I also built a Windows application, whose file has been submitted to Microsoft for licence verification, whose file has been submitted to Microsoft for licence verification, whose file has been submitted to Microsoft for licence verification, with browser-based access intended for Mac and other compatible devices. A Cloudflare-based encrypted synchronization design aims to make changes available across devices promptly, without manual copying."},{"type":"image","alt":"Illustration of windows view","src":"clearline-windows.webp"},{"type":"image","alt":"Illustration of sync view","src":"clearline-sync.webp"}]},{"id":"clearline-chapter-5","title":"The value in my life","words":83,"elements":[{"type":"p","html":"Clearline gives me <strong>mental freedom</strong> by moving commitments out of my head, <strong>device freedom</strong> by reducing dependence on one ecosystem, and <strong>creative freedom</strong> through vibe coding. I built it without conventional development fees, using lightweight infrastructure designed to avoid subscriptions and routine server maintenance. Hosting limits, software updates, and occasional troubleshooting can still apply."},{"type":"p","html":"I borrowed the inspiration from Things 3, adopted the discipline of GTD, and built something for my own life. <strong>Less mental clutter. More control. More attention for what matters.</strong>"}]}]};
const ENERGY_INFLATION_ARTICLE={"id":"energy-inflation-2026","title":"The Energy Shock: Why Lower Crude Prices May Not Restore Disinflation","date":"11 jul 2026","totalWords":821,"chapters":[{"id":"energy-inflation-2026-introduction","title":"introduction","words":22,"elements":[{"type":"p","html":"<em>Crude supply is recovering faster than refining capacity and petroleum-product trade. This divergence could prolong headline inflation pressure despite weaker demand.</em>"}]},{"id":"energy-inflation-2026-chapter-1","title":"Economic view","words":88,"elements":[{"type":"p","html":"The Middle East energy shock has created a distinction between crude availability and refined-fuel supply. Although crude prices declined substantially during June, diesel, gasoline and other product markets remained constrained."},{"type":"p","html":"Our central expectation is that headline inflation will remain under pressure in H2 2026, even if crude benchmarks retreat from wartime highs. The argument is not that energy prices must produce persistent core inflation: restoring crude flows does not immediately restore refineries, product inventories or distribution networks. Different recovery speeds can delay relief to households and businesses."}]},{"id":"energy-inflation-2026-chapter-2","title":"Crude recovery versus product shortages","words":192,"elements":[{"type":"p","html":"The <a href=\"https://www.iea.org/reports/oil-market-report-july-2026\" target=\"_blank\" rel=\"noopener\">IEA July Oil Market Report</a> estimates that global oil supply recovered by 4.1 million barrels per day in June to 98.8 million barrels per day, but remained approximately 9.4 million barrels per day below pre-war levels. Gulf exports recovered to 16.1 million barrels per day, compared with approximately 24 million before the conflict. Refinery operations recovered more slowly."},{"type":"p","html":"<strong>Exhibit 1. Energy supply and inventory conditions</strong>"},{"type":"table","headers":["Indicator",
