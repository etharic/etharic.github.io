<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etharic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f1f3;--card:#f8f9fa;--ink:#1d1e22;--soft:#6b6f7a;--line:#dcdee3;--on:#34c759}
:root[data-theme="dark"]{--bg:#1e1f23;--card:#2a2b30;--ink:#f1f2f4;--soft:#9a9da8;--line:#35363c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
nav a{color:var(--ink);text-decoration:none;font-size:.9rem}
nav .logo{font-weight:600;font-size:1rem}
nav .right{display:flex;align-items:center;gap:18px}
nav .right a{color:var(--soft);display:inline-flex;align-items:center;gap:6px}
.ico{width:15px;height:15px;flex:none}
nav .right a:hover,nav .right a.on{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.switch{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--on)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
h1{font-size:2.2rem;line-height:1.2;margin:40px 0 12px;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 14px;color:var(--soft)}
main p a,.link{color:var(--ink)}
.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:400;margin:64px 0 16px}
.hero{display:grid;grid-template-columns:1fr 176px;gap:32px;align-items:start;margin-top:32px}
.hero h1{margin:8px 0 12px}
.btn{display:inline-block;border:1px solid var(--line);color:var(--ink);padding:8px 16px;border-radius:8px;text-decoration:none;font-size:.85rem;background:var(--card)}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--soft);background:var(--card);color:var(--soft);font-size:.8rem;padding:8px}
.cap{color:var(--soft);font-size:.75rem;text-align:center;margin-top:8px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);text-decoration:none}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
.latest{display:flex;gap:14px;align-items:center}
.latest img{width:192px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .t{font-size:.85rem;margin-top:10px;font-weight:500}
.sub{color:var(--soft);font-size:.75rem}
.sub strong{color:var(--ink);font-weight:600}
h1 .fade{color:var(--soft);opacity:.5}
.post{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.post a{color:var(--ink);text-decoration:none;font-size:.95rem}
.post a:hover{text-decoration:underline}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 18px}
.bar div{height:100%;background:var(--ink)}
.video{position:relative;padding-top:56.25%;margin-bottom:16px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
footer{margin-top:72px;padding:26px 0 44px;border-top:1px solid var(--line);font-size:.85rem;color:var(--soft)}
.subrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:26px}
.subrow input{flex:1 1 160px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit}
.subrow input::placeholder{color:var(--soft)}
.subrow button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.subrow input:focus-visible,.subrow button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.subnote{flex-basis:100%;margin:0;font-size:.8rem}
.footrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 24px}
.where{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--on)}
.dot.off{background:var(--soft)}
.cat{color:var(--ink);display:block}
.socials a{color:var(--ink);text-decoration:none;margin-left:16px}
.socials a:first-child{margin-left:0}
@media (max-width:480px){nav .right{gap:12px}.ico{display:none}.hero{grid-template-columns:1fr}.hero .pic{max-width:160px}.latest img{width:104px}}
@media (prefers-reduced-motion:reduce){.switch,.switch::after{transition:none}}
</style>
</head>

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paras = t => t.split(/\n\s*\n/).map(x => `<p>${esc(x)}</p>`).join("");
const thumb = id => `https://img.youtube.com/vi/${esc(id)}/mqdefault.jpg`;
const watch = id => `https://www.youtube.com/watch?v=${esc(id)}`;
function nameHtml() {
  const full = FULLNAME || NAME;
  const i = full.toLowerCase().indexOf(NAME.toLowerCase());
  if (i < 0) return esc(full);
  const fade = t => t ? `<span class="fade">${esc(t)}</span>` : "";
  return fade(full.slice(0, i)) + esc(full.slice(i, i + NAME.length)) + fade(full.slice(i + NAME.length));
}
const postRow = p => `<div class="post"><a href="#${esc(p.id)}">${esc(p.title)}</a><span class="sub">${esc(p.date)}</span></div>`;

function home() {
  const src = PHOTO || BUILT_IN_PHOTO;
  const pic = src ? `<img class="photo" src="${esc(src)}" alt="photo of ${esc(NAME)}">` : `<div class="photo ph">your photo here</div>`;
  let h = `<div class="hero"><div><h1>hey, i'm ${nameHtml()}<span class="fade">!</span></h1><p>${esc(INTRO)}</p><a class="btn" href="#contact">let's connect</a></div><div class="pic">${pic}<div class="cap">${esc(PHOTO_CAPTION)}</div></div></div>`;
  if (LATEST_VIDEO.id) h += `<div class="label">latest upload</div><a class="card latest" href="${watch(LATEST_VIDEO.id)}"><img src="${thumb(LATEST_VIDEO.id)}" alt=""><span>${esc(LATEST_VIDEO.title)}</span></a>`;
  if (FAVORITE_VIDEOS.length) h += `<div class="label">some of my favorite videos</div><div class="grid">` + FAVORITE_VIDEOS.map(v =>
    `<a class="card" href="${watch(v.id)}"><img src="${thumb(v.id)}" alt=""><div class="t">${esc(v.title)}</div></a>`).join("") + `</div>`;
  h += `<div class="label">latest posts</div>` + POSTS.slice(0,3).map(postRow).join("");
  h += `<div class="label">hobby progress</div>` + HOBBIES.map(x => {
    const pct = Math.min(100, Math.round(x.done / x.goal * 100));
    return `<div style="font-size:.9rem">${esc(x.name)} <span class="sub">&nbsp;${x.done} of ${x.goal}</span><div class="bar" role="progressbar" aria-label="${esc(x.name)}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div></div>`;
  }).join("");
  return h;
}
function year() {
  const goals = YEAR_GOALS.map(g => `<div class="post" style="justify-content:flex-start;gap:12px"><span aria-hidden="true">${g.done ? "●" : "○"}</span><span>${esc(g.text)}</span><span class="sub" style="margin-left:auto">${g.done ? "done" : "in progress"}</span></div>`).join("");
  const hi = YEAR_HIGHLIGHTS.map(h => `<div class="post"><span>${esc(h.text)}</span><span class="sub">${esc(h.when)}</span></div>`).join("");
  return `<h1>${esc(YEAR)}</h1><p>${esc(YEAR_INTRO)}</p><div class="label">goals</div>${goals}<div class="label">highlights</div>${hi}`;
}
const blog = () => `<h1>blog</h1>` + POSTS.map(postRow).join("");
const about = () => `<h1>about</h1>` + paras(ABOUT);
const contact = () => `<h1>contact</h1><p>the best way to reach me is email.</p><a class="btn" href="mailto:${esc(EMAIL)}">${esc(EMAIL)}</a>`;
function post(p) {
  const v = p.video ? `<div class="video"><iframe src="https://www.youtube.com/embed/${esc(p.video)}" title="video" allowfullscreen></iframe></div>` : "";
  return `<h1>${esc(p.title)}</h1><div class="sub" style="margin-bottom:20px">${esc(p.date)}</div>${v}${paras(p.body)}`;
}

function route(forced) {
  const id = typeof forced === "string" ? forced : location.hash.slice(1);
  const p = POSTS.find(x => x.id === id);
  const pages = { "": home, [YEAR]: year, blog, about, contact };
  app.innerHTML = p ? post(p) : (pages[id] || home)();
  document.title = p ? p.title + " | " + BRAND : BRAND;
  document.querySelectorAll("nav .right a").forEach(a => a.classList.toggle("on", a.dataset.r === id || (p && a.dataset.r === "blog")));
  window.scrollTo(0, 0);
}

function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  document.getElementById("theme").setAttribute("aria-checked", t === "dark");
  if (save) { try { localStorage.setItem("theme", t); } catch(e){} }
}
document.getElementById("logo").textContent = BRAND;
const yl = document.getElementById("yearlink"); yl.textContent = YEAR; yl.href = "#" + YEAR; yl.dataset.r = YEAR;
const ICONS = {
  year: '<path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4"/>',
  about: '<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
  blog: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>',
  contact: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/>'
};
document.querySelectorAll("nav .right a").forEach(a => {
  const key = a === yl ? "year" : a.dataset.r;
  if (ICONS[key]) a.insertAdjacentHTML("afterbegin", `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[key]}</svg>`);
});
const CAT = [".#...#..",".##.##..",".#####..",".#.#.#..",".#####..","..###...",".#####..",".#####.#",".######."];
function catSvg() {
  let r = "";
  CAT.forEach((row, y) => [...row].forEach((c, x) => { if (c === "#") r += `<rect x="${x*3}" y="${y*3}" width="3" height="3"/>`; }));
  return `<svg class="cat" width="24" height="27" viewBox="0 0 24 27" fill="currentColor" aria-hidden="true">${r}</svg>`;
}
function tick() {
  const el = document.getElementById("clock");
  if (!el) return;
  try {
    const t = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TIMEZONE }).format(new Date());
    const h = parseInt(t, 10);
    el.textContent = "( " + t + " )";
    document.getElementById("dot").classList.toggle("off", h < 7 || h >= 23);
  } catch (e) { el.textContent = ""; }
}
function footer() {
  const f = document.getElementById("foot");
  f.innerHTML =
    `<form class="subrow" id="sub"><label for="em">get an email when i write something</label>
      <input id="em" name="email" type="email" required placeholder="you@example.com"><input type="hidden" name="embed" value="1">
      <button type="submit">subscribe</button><p class="subnote" id="subnote" role="status"></p></form>
    <div class="footrow"><div class="where">${CITY ? `<span>currently in ${esc(CITY)}</span><span id="clock"></span><span class="dot" id="dot"></span>${catSvg()}` : ""}</div>
    <div class="socials">` + SOCIALS.map(s => `<a href="${esc(s.url)}">${esc(s.label)}</a>`).join("") + `</div></div>`;
  const form = document.getElementById("sub");
  if (SUBSCRIBE_URL) { form.action = SUBSCRIBE_URL; form.method = "post"; form.target = "_blank"; }
  else form.onsubmit = e => { e.preventDefault(); document.getElementById("subnote").textContent = "subscribing isn't switched on yet."; };
  tick(); setInterval(tick, 30000);
}
footer();
let saved = null;
try { saved = localStorage.getItem("theme"); } catch(e){}
setTheme(saved || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"), false);
document.getElementById("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
window.addEventListener("hashchange", () => route());
window.addEventListener("popstate", () => route());
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.pushState(null, "", "#" + id); } catch (err) {}
  route(id);
});
route();
</script>
